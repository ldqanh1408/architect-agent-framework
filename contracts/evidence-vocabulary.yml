  question_it_answers: which view, at which C4 level, generated from what
  page_class_families: *id009
  confidence: medium
  detector:
    any:
    - \bdiagram\b
    - \bC4\b
    - \bcontext (view|diagram)\b
    - \bcontainer (view|diagram)\b
    - \bsequence\b
    - \bdeployment (view|topology)\b
    - \bbounded contexts?\b
    - \btopology\b
    none: []
  examples:
    positive:
    - Seven bounded contexts and a standard profile.
    - The deployment topology shall be shown per environment.
    negative:
    - The system shall cache the translation.
    - The client shall render an avatar.
- id: feature_cluster
  family: doc
  meaning: Several requirements add up to one thing a user would name.
  question_it_answers: which requirements belong to one runtime scenario
  page_class_families: *id009
  confidence: medium
  detector:
    any:
    - \bMVP\b
    - \bfeature\b
    - \bscope(s|d)?\b
    - \bprivate/group chat\b
    - \bAI (Q&A|summary|assistant)\b
    - \btranslation\b
    - \bnotification(s)?\b
    - \bsearch\b
    none: []
  examples:
    positive:
    - The MVP scopes private/group chat, text/image, automatic translation, AI Q&A/summary.
    - Notifications cover FCM, APNs and desktop system notifications.
    negative:
    - The gateway shall verify the token.
    - Keys shall live in secret management.
# --- Eleven domain-specific tokens for AI, resilience, cryptographic, and edge concerns ----
#
# Accepted after empirical precision validation across the golden prompt corpus: one
# token that fires by mistake admits a whole family of pages nobody asked for
# token per domain archetype with verified signal accuracy:
# AI fixture 8/8, negative fixture 0/11. Each gates an existing slot as an added
# `or`, so no workspace loses a page it had; see `output_modules.py`.
#
# Eight belong to the `ai` family: the condition for the ten 04_ai_architecture
# skills to have any page of their own. Three are operational.
- id: model_invocation
  family: ai
  meaning: A machine-learning model outside this module sits on the request path.
  question_it_answers: which model is called, through what contract, and what happens when it is slow, wrong or down
  page_class_families:
  - contract
  - mechanism
  confidence: high
  detector:
    any:
    - \b(LLM|large language model|foundation model|language model)s?\b
    - \b(ChatGPT|GPT-?\d\w*|Claude|Gemini|Grok|Llama|Mistral)\b
    - \bAI (assistant|model|summary|summaries|summari[sz]ation|completion|generation)\b
    - \b(ML|machine[- ]learning) models?\b
    - \bmodel (inference|provider|endpoint|call|API)s?\b
    none: []
  examples:
    positive:
    - The system shall call ChatGPT/Grok through a unified AI Gateway.
    - When a user asks a question, the assistant shall invoke the LLM with the conversation context.
    - When a user requests an AI summary, the system shall summarize the unread messages.
    negative:
    - The domain model shall keep conversation and membership separate.
    - The threat model shall cover token replay at the gateway.
- id: prompt_asset
  family: ai
  meaning: A prompt is a versioned asset with an owner, not a string constant in code.
  question_it_answers: which prompt version produced this output, and how is a bad prompt rolled back
  page_class_families:
  - artifact
  confidence: high
  detector:
    any:
    - \bprompt (template|version|library|registry|catalog)s?\b
    - \bsystem prompts?\b
    - \bprompts?\b.{0,40}\b(versioned|rolled back|roll back|rollback)\b
    - \bprompt engineering\b
    none: []
  examples:
    positive:
    - System prompts shall be versioned and rolled back without a redeploy.
    - Each prompt template shall carry a version and an owner.
    negative:
    - The client shall prompt the user to confirm deletion.
    - When the session expires, the app shall prompt for login again.
- id: retrieval_corpus
  family: ai
  meaning: Answers are grounded in a corpus the system retrieves from at request time.
  question_it_answers: what is in the corpus, how it is chunked, how fresh it is, and who may see which part
  page_class_families:
  - mechanism
  - artifact
  confidence: medium
  detector:
    any:
    - \b(RAG|retrieval[- ]augmented)\b
    - \bretriev(e|es|ed|al|ing)\b.{0,40}\b(documents?|passages?|chunks?|snippets?|knowledge)\b
    - \bchunk(ed|ing)?\b.{0,30}\b(documents?|corpus|index)\b
    - \bgrounded (in|on)\b
    - \bknowledge corpus\b
    none: []
  examples:
    positive:
    - The assistant shall answer from a retrieval-augmented index of product manuals.
    - The system shall retrieve the relevant document chunks before generating a reply.
    negative:
    - The client shall retrieve the conversation list on launch.
    - The API shall return paginated search results.
- id: embedding_space
  family: ai
  meaning: Vectors exist, with a dimension and a model that produced them.
  question_it_answers: which model made the vectors, and what is re-indexed when that model changes
  page_class_families:
  - artifact
  - mechanism
  confidence: high
  detector:
    any:
    - \bembeddings\b
    - \bembedding (model|vector|dimension|space|index)s?\b
    - \bvector (store|database|db|index|search|similarity)\b
    - \bsemantic (search|similarity)\b
    - \b(cosine similarity|HNSW|nearest[- ]neighbou?r)\b
    none: []
  examples:
    positive:
    - The system shall store message embeddings in a vector index for semantic search.
    - When the embedding model changes, every stored vector shall be re-indexed.
    negative:
    - The client shall support embedding a video link in a message.
    - The web view shall render embedded maps.
- id: agent_autonomy
  family: ai
  meaning: Code or actions chosen by a model will run without a person choosing each step.
  question_it_answers: what may the agent do alone, what needs a human gate, and how large is the blast radius
  page_class_families:
  - mechanism
  - threat_model
  confidence: high
  detector:
    any:
    - \b(AI|autonomous|LLM|coding|software) agents?\b
    - \bagentic\b
    - \bmulti-agent\b
    - \bagent (loop|workflow|plan)s?\b
    none: []
  examples:
    positive:
    - An autonomous agent shall plan and apply refactoring steps in the repository.
    - The AI agent shall open a pull request only after a human approves its plan.
    negative:
    - When no support agent is online, the chat shall queue the customer.
    - The server shall log the browser user agent for each session.
- id: tool_surface
  family: ai
  meaning: A model can call tools that have side effects outside the conversation.
  question_it_answers: which tools are allowlisted, are they idempotent, and who audits what the model did with them
  page_class_families:
  - contract
  - threat_model
  confidence: high
  detector:
    any:
    - \b(tool|function)[- ](use|calling|calls?)\b
    - \bMCP\b
    - \bmodel context protocol\b
    - \b(model|LLM|agent|assistant)\b.{0,40}\b(calls?|invokes?|uses?)\b.{0,20}\btools?\b
    none: []
  examples:
    positive:
    - The assistant shall use function calling to create calendar events.
    - Tools exposed to the agent over MCP shall be allowlisted per organization.
    negative:
    - The admin tool shall export audit logs as CSV.
    - Developers shall use the CLI tool to seed test data.
- id: eval_criterion
  family: ai
  meaning: Model output is judged against a stated quality bar, and a regression blocks a change.
  question_it_answers: what is the golden set, what score blocks a release, and who owns the threshold
  page_class_families:
  - quality_scenario
  - test_strategy
  confidence: medium
  detector:
    any:
    - \b(golden|evaluation|eval) (set|dataset|suite)s?\b
    - \b(hallucination|groundedness|faithfulness)\b
    - \b(LLM|model|AI) (outputs?|responses?|answers?|summaries)\b.{0,40}\b(evaluat|scor|grad|judg)\w*
    - \b(evaluat|scor|grad|judg)\w*\b.{0,40}\b(LLM|model|AI) (outputs?|responses?|answers?|summaries)\b
    - \bLLM[- ]as[- ]a[- ]judge\b
    none: []
  examples:
    positive:
    - AI summaries shall be scored against a golden set before each model upgrade.
    - The hallucination rate on the evaluation suite shall stay below 2%.
    negative:
    - Employees shall receive an annual performance evaluation.
    - The fitness function shall evaluate p95 latency on every build.
- id: token_budget
  family: ai
  meaning: Model use is capped by a token or spend budget, and running out has defined behaviour.
  question_it_answers: what is the budget per tenant or request, and what happens when it is exhausted
  page_class_families:
  - mechanism
  - quality_scenario
  confidence: medium
  detector:
    any:
    - \btoken (budget|quota|limit|usage)s?\b
    - \b(prompt|completion|input|output|context|LLM|model) tokens?\b
    - \bcontext window\b
    - \b(LLM|model|AI) (spend|cost|budget|quota)s?\b
    none: []
  examples:
    positive:
    - Each tenant shall have a monthly LLM token budget, and AI features degrade to cached answers once it is spent.
    - The context window shall be capped at 8k input tokens per request.
    negative:
    - Refresh tokens shall expire after 30 days.
    - The push service shall store one FCM token per device.
- id: tenancy_boundary
  family: security
  meaning: Data and limits are partitioned by tenant, and a request must never cross that line.
  question_it_answers: where is the tenant enforced, and what proves one tenant cannot read another's data
  page_class_families:
  - mechanism
  - threat_model
  confidence: medium
  detector:
    any:
    - \bmulti-?tenan(t|cy)\b
    - \btenants?\b.{0,40}\b(isolat|partition|segregat)\w*
    - \b(isolat|partition|segregat)\w*\b.{0,40}\btenants?\b
    - \bper[- ]tenant\b
    - \bcross[- ]tenant\b
    - \btenant (id|boundary|isolation|scope)\b
    none: []
  examples:
    positive:
    - Each customer's data shall be isolated per tenant, and no query may read across tenants.
    - The platform is multi-tenant, and rate limits apply per tenant.
    negative:
    - The property manager shall notify a tenant when rent is overdue.
    - Each organization may define a glossary.
- id: capacity_limit
  family: quality
  meaning: A hard ceiling on throughput or concurrency that the design must hold or shed load at.
  question_it_answers: what is the ceiling, where is it enforced, and what does a caller see above it
  page_class_families:
  - quality_scenario
  - mechanism
  confidence: medium
  detector:
    any:
    - \brate[- ]limit\w*
    - \bthrottl\w*
    - \b(at most|no more than|up to|maximum of)\s+\d[\d,.]*\s*[km]?\s*(requests?|messages?|connections?|sessions?|events?|RPS|QPS|TPS|concurrent)\b
    - \bconcurrent (users|connections|sessions|requests)\b
    - \bbackpressure\b
    none: []
  examples:
    positive:
    - The gateway shall accept at most 10,000 concurrent connections per node.
    - Clients sending more than 20 requests per second shall be rate-limited.
    negative:
    - The client shall limit the display name to 64 characters.
    - The dashboard shall show up to date statistics.
- id: cutover_step
  family: infra
  meaning: Traffic or data moves from an old system to a new one in a step that can fail halfway.
  question_it_answers: what is switched, in what order, how is it reversed, and what runs in parallel meanwhile
  page_class_families:
  - mechanism
  - artifact
  confidence: medium
  detector:
    any:
    - \bcut[- ]?over\b
    - \b(strangler|blue[- ]green|dual[- ]writ(e|es|ing)|backfill|shadow traffic|parallel run)\b
    - \bmigrat\w*\b.{0,40}\b(from|off)\b.{0,40}\b(legacy|old|existing|v1)\b
    - \bdecommission\w*\b
    none: []
  examples:
    positive:
    - During cutover, the legacy chat service and the new one shall dual-write messages.
    - Users shall be migrated from the legacy directory to the new identity provider in batches.
    negative:
    - The client shall migrate its local database schema on app upgrade.
    - The user may switch between light and dark themes.
