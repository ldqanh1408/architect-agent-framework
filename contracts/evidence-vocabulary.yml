# Evidence vocabulary — domain and technology recognition rules.
#
# WHY THIS FILE DECIDES SO MUCH
#   Every `when: evidence.has('x')` in the 110 per-skill `workspace-template.yml`
#   manifests resolves here. 63 tokens are in use; they decide which of roughly
#   180 pages a materialized workspace contains. Before this file existed the
#   tokens were used by the manifests and defined nowhere, so a slot's condition
#   was a string nobody could argue with.
#
# HOW A TOKEN IS ADMITTED
#   A detector runs over one EARS clause of `clarified-requirements.md` — the rows
#   of its `| ID | EARS Requirement | MoSCoW | Resolved In |` table. `any` is a
#   list of patterns; a match admits the token. `none` vetoes it. No detector may
#   fire on the ABSENCE of text: a page must exist because a clause asked for it,
#   never because a clause failed to forbid it.
#
# EVERY TOKEN CARRIES NEGATIVE EXAMPLES
#   A detector with only positive examples has been demonstrated, not tested.
#   `tests/test_evidence_vocabulary.py` runs every example against its own
#   detector; when this file was first written 27 of 67 tokens failed their own
#   positive examples, which is exactly what the discipline is for.
#
# CONFIDENCE
#   `high`   the pattern names the thing directly.
#   `medium` the pattern infers from surrounding vocabulary. The four harvest
#            tokens are medium by construction: they decide whether
#            a cross-cutting page, a delivery page, a visual view or a runtime
#            scenario exists, and no clause says "this is cross-cutting".
#
# DO NOT hand-tune a detector to make one workspace green. Add an example first.
schema_version: '2026.08'
kind: evidence-vocabulary
tokens:
- id: inbound_port
  family: interface
  meaning: Something outside this module calls into it over a named, versioned surface.
  question_it_answers: what may a caller invoke, and what happens when it fails
  page_class_families: &id001
  - contract
  confidence: high
  detector:
    any:
    - \b(endpoint|REST|API|RPC|gRPC|route|handler)\b
    - \b(client|caller|consumer)\b.{0,40}\b(call|invoke|request|send)s?\b
    - \bthe (real-time )?gateway shall\b
    - \breceives? a request\b
    none:
    - \bcalls? out to\b
    - \bthird-party\b.{0,20}\bAPI\b
  examples:
    positive:
    - When a client sends a message, the real-time gateway shall verify the token before forwarding.
    - The system shall expose a REST endpoint for conversation history.
    negative:
    - The system shall store the binary in RustFS.
    - When translation confidence is low, the system shall display the original text.
- id: outbound_call
  family: interface
  meaning: This module calls something it does not own, so latency and failure are its problem.
  question_it_answers: what does this depend on at runtime, and what happens when that is slow
  page_class_families: *id001
  confidence: high
  detector:
    any:
    - \bcalls? (out to|into)\b
    - \b(invoke|call)s? (ChatGPT|Grok|the [A-Z]\w+|an? (external|third-party|upstream))
    - \bthrough (a|the) (unified )?\w+ Gateway\b
    - \bforward(s|ing)? (it|the request|the message) to\b
    none: []
  examples:
    positive:
    - The system shall call ChatGPT/Grok through a unified AI Gateway.
    - When a client sends a message, the gateway shall forward the message to the conversation service.
    negative:
    - The system shall present the conversation list.
    - The original is the single baseline for audit.
- id: published_event
  family: interface
  meaning: A domain fact leaves this module for subscribers who may not exist yet.
  question_it_answers: what does this announce, with what schema and ordering
  page_class_families: *id001
  confidence: high
  detector:
    any:
    - \b(publish|emit|announce)(es|s|ed)?\b.{0,30}\bevent\b
    - \bevent\b.{0,20}\b(published|emitted)\b
    - \boutbox\b
    - \bfan(s|-| )out\b
    none:
    - \bconsume(s|d)?\b.{0,20}\bevent\b
  examples:
    positive:
    - When a message is accepted, the service shall publish a MessageAccepted event via the outbox.
    - The system shall emit a translation-completed event for subscribers.
    negative:
    - The system shall cache the translation by message version.
    - When a notification is tapped, the client shall jump to the conversation.
- id: consumed_event
  family: interface
  meaning: This module reacts to a fact announced elsewhere.
  question_it_answers: what does this listen for, and what does it do when the message is a duplicate
  page_class_families: *id001
  confidence: high
  detector:
    any:
    - \b(consume|subscribe|listen)(s|d|es)?\b.{0,30}\bevent\b
    - \bon receiving (a|the) \w+ event\b
    - \breacts? to\b.{0,25}\bevent\b
    none: []
  examples:
    positive:
    - The translation service shall consume the MessageAccepted event.
    - On receiving a MemberRemoved event, the gateway shall drop the session.
    negative:
    - The system shall publish a MessageAccepted event.
    - The client shall reconnect automatically.
- id: field_mapping
  family: interface
  meaning: Two schemas that mean the same thing spell it differently, so a mapping exists.
  question_it_answers: which field on one side becomes which field on the other
  page_class_families: *id001
  confidence: high
  detector:
    any:
    - \bmap(s|ped|ping)?\b.{0,60}?\b(field|attribute|schema|to)\b
    - \btransform(s|ed|ation)?\b.{0,20}\b(payload|schema)\b
    - \bnormalis|normaliz
    none: []
  examples:
    positive:
    - The adapter shall map the provider's `finish_reason` to the internal completion status.
    - The system shall normalize Unicode before comparing glossary terms.
    negative:
    - The system shall cache the translation.
    - The gateway shall verify the token.
- id: non_idempotent_call
  family: interface
  meaning: A retry of this call is not free — it charges, sends, or mutates twice.
  question_it_answers: what makes a retry safe here
  page_class_families: *id001
  confidence: high
  detector:
    any:
    - \bnot duplicate-send\b
    - \bidempotenc|idempotent\b
    - \bexactly[- ]once\b
    - \bshall not (send|charge|create) (it |the \w+ )?twice\b
    - \bde-?duplicat
    none: []
  examples:
    positive:
    - When the network switches, the client shall not duplicate-send a message.
    - The payment adapter shall pass an idempotency key on every retry.
    negative:
    - The system shall cache the translation by target language.
    - The client shall present the conversation list.
- id: exported_symbol
  family: interface
  meaning: A public symbol other code compiles against.
  question_it_answers: what is the supported surface, and what breaks a consumer
  page_class_families: *id001
  confidence: high
  detector:
    any:
    - \bpublic (API|interface|symbol|class|function)\b
    - \bSDK\b
    - \bexport(s|ed)?\b.{0,40}?\b(symbol|type|function|interface|class)\b
    none: []
  examples:
    positive:
    - The library shall export a stable `Translate` interface.
    - The SDK shall expose a public client class.
    negative:
    - The gateway shall verify the token.
    - The system shall cache the translation.
- id: extension_point
  family: interface
  meaning: Third-party code plugs in here.
  question_it_answers: what may be extended, and what the host guarantees
  page_class_families: *id001
  confidence: high
  detector:
    any:
    - \bplug-?in\b
    - \bextension point\b
    - \bhook\b
    - \bextensible\b
    - \bcustom (provider|handler|adapter)\b
    none: []
  examples:
    positive:
    - AI providers shall be extensible beyond ChatGPT and Grok.
    - The host shall expose a hook for custom validators.
    negative:
    - The system shall store the binary in RustFS.
    - The client shall reconnect automatically.
- id: owned_state
  family: data
  meaning: This module is the writer of record for some state.
  question_it_answers: who owns this data, at what grain, and for how long
  page_class_families: &id002
  - artifact
  - contract
  confidence: high
  detector:
    any:
    - \bshall (store|persist|record|keep)\b
    - \bstore(s|d)? (only )?(the )?\w*\s*(metadata|reference|key|row|document)
    - \bMongoDB\b
    - \bwriter of record\b
    - \bsingle baseline\b
    none:
    - \bcache only\b
    - \bRedis\b.{0,20}\bcache\b
  examples:
    positive:
    - The system shall store only object key/metadata in MongoDB.
    - The original is the single baseline for audit and re-translation.
    negative:
    - Redis is used as cache only.
    - The client shall jump to the target conversation.
- id: persisted_dataset
  family: data
  meaning: A dataset that survives a restart and therefore needs a schema and a retention rule.
  question_it_answers: what is the schema, and when is a row deleted
  page_class_families: *id002
  confidence: high
  detector:
    any:
    - \b(MongoDB|Postgres|database|collection|table)\b
    - \bpersist(ed|ence|s)?\b
    - \bshall store\b
    none:
    - \bin-memory\b
    - \bcache only\b
  examples:
    positive:
    - MongoDB persistence for conversations and messages.
    - The system shall persist the audit trail.
    negative:
    - Redis is used as cache only.
    - The client shall render the conversation list.
- id: derived_dataset
  family: data
  meaning: Data computed from other data, so it can be rebuilt and must not be edited.
  question_it_answers: what is this derived from, and how is it rebuilt
  page_class_families: *id002
  confidence: high
  detector:
    any:
    - \bderived\b
    - \bcomputed from\b
    - \bcache(s|d)? it by\b
    - \bmaterialis|materializ
    - \bprojection\b
    none: []
  examples:
    positive:
    - Translation is derived and cacheable.
    - The system shall cache it by (message version, target language, engine version).
    negative:
    - The original is the single baseline.
    - The gateway shall verify the token.
- id: query_consumer
  family: data
  meaning: Someone reads this data who did not write it.
  question_it_answers: who reads this, and what shape do they need
  page_class_families: *id002
  confidence: high
  detector:
    any:
    - \bread(s|er|ing)?\b.{0,40}?\b(data|dataset|collection|history|context|record)\b
    - \bquer(y|ies|ied)\b
    - \breporting\b
    - \bsearch\b.{0,25}\bby\b
    none: []
  examples:
    positive:
    - Search shall be by conversation name, member name and department.
    - The AI shall read only authorized recent context.
    negative:
    - The system shall store the binary in RustFS.
    - The client shall reconnect automatically.
- id: consistency_boundary
  family: data
  meaning: Two writes must either both land or neither.
  question_it_answers: what is transactional here, and what is eventually consistent
  page_class_families: *id002
  confidence: high
  detector:
    any:
    - \btransaction(al|s)?\b
    - \batomic(ally)?\b
    - \beventual(ly)? consistent\b
    - \bsequence numbers?\b
    - \border(ing)?\b.{0,20}\b(guarantee|scope)\b
    - \bboth .{0,20}or neither\b
    none: []
  examples:
    positive:
    - Server-assigned incremental sequence numbers used for ordering and incremental sync.
    - The outbox write and the state change shall be atomic.
    negative:
    - The client shall present the conversation list.
    - The system shall extend the glossary.
- id: domain_fact
  family: data
  meaning: Something true about the business, independent of any screen or table.
  question_it_answers: what does the business assert here, in its own words
  page_class_families: *id002
  confidence: high
  detector:
    any:
    - \bthe system shall (never|always)\b
    - \bis the single\b
    - \bshall not overwrite\b
    - \bbaseline\b
    - \bbusiness rule\b
    - \binvariant\b
    - \blapses?\b
    - \bimmediately\b
    none: []
  examples:
    positive:
    - The system shall never overwrite the original text.
    - A member's permission lapses immediately on leaving the organization.
    negative:
    - The client shall render a toggle.
    - The system shall cache the translation.
- id: business_rule
  family: data
  meaning: A decision the business makes that the code must obey.
  question_it_answers: what rule applies, and who may change it
  page_class_families: *id002
  confidence: high
  detector:
    any:
    - \bshall enforce\b
    - \brule\b
    - \bpolicy\b
    - \blimit of\b
    - \bonly (if|when|the)\b
    - \bauthoriz(ed|ation)\b.{0,25}\bto read\b
    - \bpermission\b
    none: []
  examples:
    positive:
    - The system shall enforce an MVP recommended limit of 200 members.
    - The AI shall read only context the current user is authorized to read.
    negative:
    - The client shall reconnect automatically.
    - The system shall cache the translation.
- id: reactive_rule
  family: data
  meaning: A rule that fires on an event rather than on a request.
  question_it_answers: what triggers this, and what happens if the trigger arrives twice
  page_class_families: *id002
  confidence: high
  detector:
    any:
    - \bwhen\b.{0,60}\bshall automatically\b
    - \bon (receiving|detecting)\b
    - \btrigger(s|ed)?\b
    - \bshall reconnect automatically\b
    - \bshall auto-?detect\b
    none: []
  examples:
    positive:
    - When a user sends a message, the system shall auto-detect the source language.
    - When the network switches, the client shall reconnect automatically.
    negative:
    - The system shall store the binary in RustFS.
    - The library shall export a stable interface.
- id: regulated_field
  family: data
  meaning: A field whose handling is constrained by law or policy, not by taste.
  question_it_answers: which fields are regulated, and what the constraint is
  page_class_families: *id002
  confidence: high
  detector:
    any:
    - \bPII\b
    - \bpersonal data\b
    - \bretention\b
    - \baudit\b
    - \bGDPR|HIPAA|SOC ?2\b
    - \bdata (policy|residency|classification)\b
    - \bmask(ed|ing)?\b
    none: []
  examples:
    positive:
    - Organization admins shall configure data retention and audit.
    - The AI gateway shall mask tokens before logging.
    negative:
    - The client shall present the conversation list.
    - The system shall cache the translation.
- id: source_feed
  family: data
  meaning: Data arrives from somewhere on a schedule or a stream.
  question_it_answers: where does this arrive from, and what happens when the feed is late
  page_class_families: *id002
  confidence: high
  detector:
    any:
    - \bfeed\b
    - \bingest(s|ion|ed)?\b
    - \bstream(s|ing|ed)?\b
    - \bimport(s|ed)?\b
    - \bupstream (source|system)\b
    - \bcapability matrix\b
    none: []
  examples:
    positive:
    - The language catalog shall be generated from the translation engine capability matrix.
    - The pipeline shall ingest the upstream events stream.
    negative:
    - The client shall render a toggle.
    - The gateway shall verify the token.
- id: storage_tier
  family: data
  meaning: Not all of this data needs the same speed or price.
  question_it_answers: what lives hot, what lives cold, and who moves it
  page_class_families: *id002
  confidence: high
  detector:
    any:
    - \bhot\b.{0,20}\bcold\b
    - \bstorage (tier|class)\b
    - \barchive\b
    - \bRustFS\b.{0,40}\bMongoDB\b
    none: []
  examples:
    positive:
    - Binaries live in RustFS; metadata lives in MongoDB.
    - Objects older than a year shall move to archive storage.
    negative:
    - The gateway shall verify the token.
    - The client shall reconnect.
- id: storage_quota
  family: data
  meaning: There is a ceiling on how much may be stored.
  question_it_answers: what is the ceiling, and what happens at it
  page_class_families: *id002
  confidence: high
  detector:
    any:
    - \bquota\b
    - \b(size|storage) limit\b
    - \b≤ ?\d+ ?(MB|GB|TB)\b
    - \b(at most|max(imum)?|no more than) \d+ ?(MB|GB|TB|chars|characters|members)\b
    none: []
  examples:
    positive:
    - Images shall be JPG/PNG/WebP of at most 20 MB.
    - Organization admins shall configure usage quota.
    negative:
    - The system shall cache the translation.
    - The client shall present the list.
- id: retention_policy
  family: data
  meaning: Data is deleted on a rule, not on a whim.
  question_it_answers: how long is this kept, and who may shorten it
  page_class_families: *id002
  confidence: high
  detector:
    any:
    - \bretention\b
    - \bdelete(d|s)? after\b
    - \bexpir(e|es|y|ation)\b
    - \bTTL\b
    - \bshort-lived\b
    none: []
  examples:
    positive:
    - Organization admins shall configure data retention.
    - Presigned URLs shall be short-lived.
    negative:
    - The system shall store the binary.
    - The client shall reconnect.
- id: lifecycle_policy
  family: data
  meaning: An object moves through states on a schedule.
  question_it_answers: what states does this pass through, and what moves it
  page_class_families: *id002
  confidence: high
  detector:
    any:
    - \blifecycle\b
    - \bquarantine\b
    - \btransition(s|ed)? to\b
    - \bstate machine\b
    - \bquarantin
    none: []
  examples:
    positive:
    - Un-scanned objects shall be quarantined.
    - Objects shall transition to archive after the retention window.
    negative:
    - The gateway shall verify the token.
    - The system shall cache the translation.
- id: trust_boundary
  family: security
  meaning: A point where data or a caller crosses from less trusted to more trusted.
  question_it_answers: who is trusted on each side, and what is checked at the line
  page_class_families: &id003
  - mechanism
  - threat_model
  confidence: high
  detector:
    any:
    - \bverif(y|ies|ied)\b.{0,30}\b(token|permission|signature)\b
    - \btrust boundary\b
    - \bauthenticat|authoriz
    - \bshall validate\b
    - \bpresigned\b
    - \bsecret management\b
    - \bkeys? .{0,30}(server-side|never .{0,20}client)
    - \bshall not (be able to )?call .{0,30}directly\b
    - \bthird-party\b
    - \bexternal (provider|engine|service)\b
    - \bscan for malicious\b
    none: []
  examples:
    positive:
    - When a client sends a message, the gateway shall verify the token and member permission.
    - Client shall not call ChatGPT/Grok directly; keys live in server-side secret management.
    negative:
    - The client shall present the conversation list.
    - The system shall cache the translation.
- id: credential_or_key
  family: security
  meaning: A secret exists, so its storage and rotation are design decisions.
  question_it_answers: where does this secret live, and how is it rotated
  page_class_families: *id003
  confidence: high
  detector:
    any:
    - \b(API )?key(s)?\b
    - \bsecret(s| management)?\b
    - \bcredential(s)?\b
    - \btoken\b
    - \bpassword\b
    - \brotat(e|ion)\b
    none: []
  examples:
    positive:
    - AI provider keys shall be stored only in server-side secret management.
    - Login shall be by email and password.
    negative:
    - The client shall render the conversation list.
    - The system shall cache by target language.
- id: authentication_rule
  family: security
  meaning: How the system decides who someone is.
  question_it_answers: what proves identity here, and what happens when the proof expires
  page_class_families: *id003
  confidence: high
  detector:
    any:
    - \bauthenticat
    - \blog ?in\b
    - \bsign ?in\b
    - \bemail(/| and )password\b
    - \bsession token\b
    - \bMFA\b
    - \bSSO\b
    none: []
  examples:
    positive:
    - Login shall be by email and password.
    - The gateway shall authenticate the session token.
    negative:
    - The system shall cache the translation.
    - The client shall present the list.
- id: authorization_policy
  family: security
  meaning: How the system decides what someone may do.
  question_it_answers: who may do what, and where that is decided
  page_class_families: *id003
  confidence: high
  detector:
    any:
    - \bauthoriz
    - \bpermission\b
    - \brole\b
    - \badmin\b
    - \bmay (only )?(read|write|access)\b
    - \baccess control\b
    - \bRBAC|ABAC\b
    - \bmay (add|remove|manage|configure)\b
    none: []
  examples:
    positive:
    - The AI shall read only context the current user is authorized to read.
    - Group admins may add and remove members.
    negative:
    - The system shall cache the translation.
    - The client shall reconnect.
- id: access_control
  family: security
  meaning: An explicit allow/deny list guards a resource.
  question_it_answers: what is guarded, and by which rule
  page_class_families: *id003
  confidence: high
  detector:
    any:
    - \baccess control\b
    - \ballow ?list|deny ?list|whitelist|blacklist\b
    - \bmember(ship)? permission\b
    - \bpermission lapses?\b
    - \brevoke(d|s)?\b
    - \bshall lapse\b
    none: []
  examples:
    positive:
    - Permission shall lapse immediately when a member leaves the organization.
    - The gateway shall check conversation member permission before forwarding.
    negative:
    - The system shall cache the translation.
    - The client shall present the list.
- id: session_management
  family: security
  meaning: A session has a beginning, an end, and a way to be cut short.
  question_it_answers: how long does a session live, and what ends it
  page_class_families: *id003
  confidence: high
  detector:
    any:
    - \bsession\b
    - \breconnect\b
    - \blog ?out\b
    - \bexpire(s|d)?\b.{0,20}\bsession\b
    - \bdevice\b.{0,20}\bsync\b
    - \bsessions? shall be invalidated\b
    - \baccount is disabled\b
    none: []
  examples:
    positive:
    - The client shall reconnect automatically when the network switches.
    - Sessions shall be invalidated when the account is disabled.
    negative:
    - The system shall store the binary in RustFS.
    - The client shall render a toggle.
- id: token_lifecycle
  family: security
  meaning: A token is issued, used, refreshed and revoked.
  question_it_answers: who issues this, how long it lives, and how it is revoked
  page_class_families: *id003
  confidence: high
  detector:
    any:
    - \btoken\b.{0,30}\b(expire|refresh|revoke|lifetime|short-lived)\b
    - \bshort-lived\b
    - \bpresigned URL\b
    - \brefresh token\b
    - \btoken limits?\b
    none: []
  examples:
    positive:
    - Attachment access shall use short-lived presigned URLs.
    - AI context shall be bounded by message-count and token limits.
    negative:
    - The client shall present the conversation list.
    - The system shall cache the translation.
- id: identity_provider
  family: security
  meaning: Identity comes from somewhere — inside or outside.
  question_it_answers: who is the source of truth for identity
  page_class_families: *id003
  confidence: high
  detector:
    any:
    - \bidentity provider\b
    - \bIdP\b
    - \bSSO\b
    - \bOAuth|OIDC|SAML\b
    - \bmember belongs to an organization\b
    - \borganization admin\b
    none: []
  examples:
    positive:
    - A member belongs to an organization; organization admins manage accounts.
    - SSO via OIDC is out of MVP scope.
    negative:
    - The system shall cache the translation.
    - The client shall reconnect.
- id: audit_trail
  family: security
  meaning: Somebody will need to prove what happened.
  question_it_answers: what is recorded, who may read it, and for how long
  page_class_families: *id003
  confidence: high
  detector:
    any:
    - \baudit\b
    - \bfor audit\b
    - \btrace(ability)?\b.{0,20}\brecord\b
    - \bimmutable log\b
    none: []
  examples:
    positive:
    - The original is the single baseline for audit and re-translation.
    - Organization admins shall configure audit.
    negative:
    - The client shall present the list.
    - The system shall cache the translation.
- id: security_log
  family: security
  meaning: A security-relevant event is written somewhere durable.
  question_it_answers: which events are logged, and where they go
  page_class_families: *id003
  confidence: high
  detector:
    any:
    - \bsecurity log\b
    - \blog(s|ged|ging)?\b.{0,30}\b(access|auth|denial|failure)\b
    - \bmask(ed|ing)?\b.{0,20}\blog
    - \baudit log\b
