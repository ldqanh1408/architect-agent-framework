  codes:
    EMPTY-SECTION:
      class: derived
      remedy: Write content under the heading, or merge it into its neighbour.
    HEADING-JUMP:
      class: style
      remedy: Use the next heading level down instead of skipping one.
    READ-ERROR:
      class: derived
      remedy: Make the file readable as UTF-8.
    REPEATED-WORD:
      class: heuristic
      remedy: Read the flagged words; fix the typo if it is one, or add the word to the rule's vocabulary
        with the measured false positive.
    UNBOUND-TODO:
      class: heuristic
      remedy: Bind the marker to a tracking id (ISSUE-n, WO-n, CLR-…), or record it in gate-suppressions.yml
        if it is a mention rather than a marker.
    UNCLOSED-FENCE:
      class: derived
      remedy: Close the code fence with the same character and length that opened it.
