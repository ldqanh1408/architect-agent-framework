- id: GATE-EVIDENCE-VOCAB
  role: gate
  kind: native
  entrypoint: architect_framework.gates.evidence_vocabulary:EvidenceVocabularyGate
  scope: catalog
  argv: []
  usage: 'usage: GATE-EVIDENCE-VOCAB (catalog-scoped; no argv)'
  side_effects: read-only
  findings:
  - VOCAB-MISSING
  - VOCAB-UNPARSEABLE
  - VOCAB-UNDEFINED
  - VOCAB-UNUSED
  - VOCAB-EXAMPLES-THIN
  - VOCAB-EXAMPLE-DISAGREES
  - VOCAB-DETECTOR-SHAPE
  - VOCAB-PROPOSED-NO-DECISION
  - VOCAB-PROPOSED-IN-USE
  title: the evidence vocabulary and the 110 manifests agree, both ways
  codes:
    VOCAB-MISSING:
      class: derived
      remedy: Restore the evidence vocabulary contract.
    VOCAB-UNPARSEABLE:
      class: derived
      remedy: Fix the manifest so it parses.
    VOCAB-UNDEFINED:
      class: contract
      remedy: Define the token in the evidence vocabulary, or stop gating slots on it.
    VOCAB-UNUSED:
      class: contract
      remedy: Gate a slot on the token, or retire its definition with a reason.
    VOCAB-EXAMPLES-THIN:
      class: contract
      remedy: Add negative examples so the detector is shown not to over-fire.
    VOCAB-EXAMPLE-DISAGREES:
      class: derived
      remedy: Fix the detector or the example so the token fires on its own positive example.
    VOCAB-DETECTOR-SHAPE:
      class: contract
      remedy: Give the detector the keys the vocabulary schema declares.
    VOCAB-PROPOSED-NO-DECISION:
      class: contract
      remedy: Record the decision the proposed token awaits.
    VOCAB-PROPOSED-IN-USE:
      class: contract
      remedy: Decide the proposed token before any manifest gates a slot on it.
  stage: ci
  phase: []
