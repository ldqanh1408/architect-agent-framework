  usage: 'usage: check_skill_creator_conformance.py [-h] [--root ROOT] [--strict] [--json]'
  side_effects: read-only
  findings:
  - SC-BAD-YAML
  - SC-BODY-LENGTH
  - SC-DESC-ANGLE
  - SC-DESC-EMPTY
  - SC-DESC-LENGTH
  - SC-DESC-SHAPE
  - SC-EXTRA-KEY
  - SC-MISSING-FIELD
  - SC-NAME-LENGTH
  - SC-NAME-MISMATCH
  - SC-NAME-SHAPE
  - SC-NO-FRONTMATTER
  phase: []
  codes:
    SC-BAD-YAML:
      class: contract
      remedy: Fix the SKILL.md frontmatter so it parses as a YAML mapping.
    SC-BODY-LENGTH:
      class: style
      remedy: Split the SKILL.md body into references/ pages so the triggered body stays small.
    SC-DESC-ANGLE:
      class: contract
      remedy: Rewrite the description without angle brackets.
    SC-DESC-EMPTY:
      class: contract
      remedy: 'Write the description: when the skill triggers and what it produces.'
    SC-DESC-LENGTH:
      class: contract
      remedy: Shorten the description to the spec's limit.
    SC-DESC-SHAPE:
      class: contract
      remedy: Make the description a single string.
    SC-EXTRA-KEY:
      class: style
      remedy: Move the extra frontmatter key into the body or a sidecar file.
    SC-MISSING-FIELD:
      class: contract
      remedy: Add the required frontmatter field.
    SC-NAME-LENGTH:
      class: contract
      remedy: Shorten the skill name to the spec's limit.
    SC-NAME-MISMATCH:
      class: style
      remedy: Rename the frontmatter `name` or the folder so they agree.
    SC-NAME-SHAPE:
      class: contract
      remedy: Rename the skill to kebab-case without leading, trailing or doubled hyphens.
    SC-NO-FRONTMATTER:
      class: contract
      remedy: Add the YAML frontmatter block to SKILL.md.
  stage: ci
