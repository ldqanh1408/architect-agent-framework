gates:
- id: GATE-LEGACY
  role: gate
  kind: native
  entrypoint: scripts/audit_legacy.py
  scope: repo
  argv: []
  usage: 'usage: audit_legacy.py [-h] [--report REPORT]'
  side_effects: read-only
  findings:
  - INVALID-PAYLOAD-CONTRACT
  - INVALID-PAYLOAD-SOURCE
  - LEGACY-CODE-FINGERPRINT
  - LEGACY-IMPORT
  - LEGACY-MEMBER
  - LEGACY-PREDICATE
  - LEGACY-PROMPT
  phase: []
  title: Remaining legacy inventory and parity closure
  codes:
    INVALID-PAYLOAD-CONTRACT:
      class: contract
      remedy: Inspect the input, restore the current declared contract and rerun before publication.
    INVALID-PAYLOAD-SOURCE:
      class: contract
      remedy: Inspect the input, restore the current declared contract and rerun before publication.
    LEGACY-IMPORT:
      class: contract
      remedy: Inspect the input, restore the current declared contract and rerun before publication.
    LEGACY-MEMBER:
      class: contract
      remedy: Inspect the input, restore the current declared contract and rerun before publication.
    LEGACY-PREDICATE:
      class: contract
      remedy: Inspect the input, restore the current declared contract and rerun before publication.
    LEGACY-PROMPT:
      class: contract
      remedy: Inspect the input, restore the current declared contract and rerun before publication.
    LEGACY-CODE-FINGERPRINT:
      class: contract
      remedy: Rebuild from current source and inspect the removed-code provenance before qualification
  stage: ci
