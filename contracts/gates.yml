- id: GATE-ARCHETYPE-VOCABULARY
  role: gate
  kind: native
  entrypoint: scripts/check_archetype_vocabulary.py
  scope: repo
  argv: []
  usage: 'usage: check_archetype_vocabulary.py [-h] [--check] [--emit]'
  side_effects: read-only
  findings: []
  phase: []
  no_findings:
    kind: exit-code
    reason: prints PASS, or FAILED with whether the vocabulary file is missing or differs from the derivation
  stage: ci
- id: GATE-AUTHORED-SECTIONS
  role: gate
  kind: native
  entrypoint: scripts/check_authored_sections.py
  scope: catalog
  argv:
  - --catalog
  - '{catalog}'
  usage: 'usage: check_authored_sections.py [-h] [--catalog CATALOG] [--cluster CLUSTER] [--similarity
    SIMILARITY] [--json]'
  side_effects: read-only
  findings:
  - example-boundary
  - example-converged
  - example-fence
  - example-ids
  - fast-path-exit
  - fast-path-steps
  - local-path
  - missing-cluster
  - missing-section
  - placeholder
  - routing-target
  phase: []
  codes:
    example-boundary:
      class: contract
      remedy: Add the 'what it does not produce' note to the Worked Example, naming the neighbouring skill
        that does.
    example-converged:
      class: derived
      remedy: Write a Worked Example from a different real scenario than the sibling skill it resembles.
    example-fence:
      class: contract
      remedy: Show real output in one fenced block of 8-40 lines in the Worked Example.
    example-ids:
      class: contract
      remedy: Quote a bracketed stable id (for example [AE-1]) from the artifact the example shows.
    fast-path-exit:
      class: contract
      remedy: Add the 'Leave the fast path' paragraph naming what pushes a request off it.
    fast-path-steps:
      class: contract
      remedy: Rewrite the Fast Path as the allowed number of numbered steps.
    local-path:
      class: derived
      remedy: Replace the machine-local path with a repository-relative one.
    missing-cluster:
      class: derived
      remedy: Pass a cluster folder that exists under the catalog, or add it to AUTHORED_CLUSTERS.
    missing-section:
      class: contract
      remedy: Write the missing authored section from a real case.
    placeholder:
      class: derived
      remedy: Replace the placeholder text in the section with authored content.
    routing-target:
      class: contract
      remedy: Route the Fast Path to a skill id that exists in the catalogue.
  stage: ci
- id: GATE-PLAN-LIFECYCLE
  role: gate
  kind: native
  entrypoint: scripts/check_plan_lifecycle.py
  scope: repo
  argv: []
  usage: 'usage: check_plan_lifecycle.py [-h] [--root ROOT]'
  side_effects: read-only
  findings: []
  phase: []
  no_findings:
    kind: exit-code
    reason: Prints source plan ownership violations and returns a failing exit code; public distributions
      report unavailable scope.
  stage: manual
- id: GATE-PUBLIC-TREE
  role: gate
  kind: native
  entrypoint: scripts/check_public_tree.py
  scope: repo
  argv: []
  usage: 'usage: check_public_tree.py [-h] [--tree TREE] [--source SOURCE] [--fingerprints FINGERPRINTS]
    [--write-fingerprints WRITE_FINGERPRINTS] [--require-paid-corpus] [--report REPORT]'
  side_effects: read-only
  findings:
  - AGENSI-EDITION
  - MACHINE-PATH
  - PAID-CONTENT
  - PAID-DISCOVERY-METADATA
  - PAID-SKILL-MD
  - PAID-SLOT-FILE
  - PATH-TOO-LONG
  - PRIVATE-QUALIFICATION-INPUT
  - PROPRIETARY-LICENSE
  - SECRET-TOKEN
  phase: []
  timeout_s: 900
  codes:
    AGENSI-EDITION:
      class: contract
      remedy: A bought (agensi edition) SKILL.md is in the tree; remove it, it belongs in a user's install
        folder.
    MACHINE-PATH:
      class: derived
      remedy: Add the path's shape to MACHINE_PATHS in scripts/build_public_tree.py, or write the path
        relative.
    PAID-CONTENT:
      class: contract
      remedy: A paragraph of a paid skill's content is in this file; remove or rewrite it.
    PAID-DISCOVERY-METADATA:
      class: contract
      remedy: Private per-skill catalog metadata belongs only in a local installed package; keep the public
        registry free-only.
    PRIVATE-QUALIFICATION-INPUT:
      class: contract
      remedy: Keep original paid fingerprint inputs outside every distributable payload.
    PAID-SKILL-MD:
      class: contract
      remedy: A paid skill's body is private; publish only the bundled free skill payloads.
    PAID-SLOT-FILE:
      class: contract
      remedy: Every paid descriptor and body belongs in the private pack; remove it from the public tree.
    PATH-TOO-LONG:
      class: contract
      remedy: Shorten the folder or file names, or leave a development-only tree out with EXCLUDED_PREFIXES
        in scripts/build_public_tree.py; a Windows marketplace clone cannot check the file out.
    PROPRIETARY-LICENSE:
      class: contract
      remedy: 'A file declares `license: Proprietary`; it is paid content, keep it out of the public tree.'
    SECRET-TOKEN:
      class: contract
      remedy: Rotate the key or token, then read it from the environment instead of the file.
  stage: ci
- id: GATE-RELEASE-ARTIFACTS
  role: gate
  kind: native
  entrypoint: scripts/check_release_artifacts.py
  scope: repo
  argv: []
  usage: 'usage: check_release_artifacts.py [-h] [--fingerprints FINGERPRINTS] [--require-paid-corpus]
    [--report REPORT] [--legacy-rules LEGACY_RULES] [artifacts ...]'
  side_effects: read-only
  findings:
  - ARTIFACT-CHANGED
  - INVALID-ARCHIVE
  phase: []
  codes:
    ARTIFACT-CHANGED:
      class: contract
      remedy: Inspect the input, restore the current declared contract and rerun before publication.
    INVALID-ARCHIVE:
      class: contract
      remedy: Rebuild a canonical archive with bounded regular files without links, aliases or duplicate
        names.
  stage: manual
- id: GATE-SKILL-CREATOR-CONFORMANCE
  role: gate
  kind: native
  entrypoint: scripts/check_skill_creator_conformance.py
