- id: GATE-CATALOG
  role: gate
  kind: native
  entrypoint: scripts/validate_catalog.py
  scope: catalog
  argv:
  - --catalog
  - '{catalog}'
  usage: 'usage: validate_catalog.py [-h] [--catalog CATALOG] [--json] [--strict]'
  side_effects: read-only
  findings:
  - body-length
  - description-budget
  - description-length
  - duplicate-id
  - empty-catalog
  - fitness-prefix-collision
  - frontmatter
  - id-format
  - manifest
  - manifest-drift
  - missing-authored-section
  - missing-catalog
  - missing-dir
  - missing-file
  - missing-section
  - missing-shared
  - name-mismatch
  phase: []
  timeout_s: 600
  codes:
    body-length:
      class: style
      remedy: 'Author the SKILL.md body past a stub: instructions, inputs, outputs.'
    description-budget:
      class: style
      remedy: Tighten the cluster's descriptions under the metadata budget.
    description-length:
      class: contract
      remedy: Rewrite the description within the catalog's length bounds.
    duplicate-id:
      class: contract
      remedy: Give each skill a unique id.
    empty-catalog:
      class: derived
      remedy: Point the validator at a catalog root that holds SKILL.md files.
    fitness-prefix-collision:
      class: contract
      remedy: Give each skill in the cluster its own fitness prefix.
    frontmatter:
      class: contract
      remedy: Fix the SKILL.md frontmatter to carry the required keys.
    id-format:
      class: contract
      remedy: Rename the package directory to lowercase kebab-case.
    manifest:
      class: derived
      remedy: Regenerate package.yml so it parses.
    manifest-drift:
      class: derived
      remedy: Regenerate the package manifest so paths, hashes and sizes match.
    missing-authored-section:
      class: contract
      remedy: Write the authored section the cluster carries, from a real case.
    missing-catalog:
      class: derived
      remedy: Point the validator at the catalog root.
    missing-dir:
      class: contract
      remedy: Add the expected directory to the package.
    missing-file:
      class: contract
      remedy: Add the required file to the package.
    missing-section:
      class: contract
      remedy: Add one of the accepted sections to SKILL.md.
    missing-shared:
      class: derived
      remedy: Restore the shared directory every package references.
    name-mismatch:
      class: contract
      remedy: Make the frontmatter name match the directory.
  stage: ci
