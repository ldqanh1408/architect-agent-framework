- id: GATE-SDD-CHECK
  role: gate
  stage: manual
  kind: native
  entrypoint: architect_framework.gates.sdd:SddCheckGate
  scope: workspace
  argv:
  - '{workspace}'
  usage: 'usage: GATE-SDD-CHECK {workspace}'
  side_effects: read-only
  phase: []
  findings:
  - SDD-CHECK-FAIL
  - SDD-CHECK-INCOMPLETE
  - SDD-CHECK-FINDING
  - SDD-ENGINE-UNAVAILABLE
  title: the SDD engine's deterministic check of a v2 workspace against its accepted baseline
  codes:
    SDD-CHECK-FAIL:
      class: contract
      remedy: Read the engine's findings, fix the documents they name, then run the check again.
    SDD-CHECK-INCOMPLETE:
      class: contract
      remedy: Reconcile the workspace so the engine has a current snapshot, then run the check again.
    SDD-CHECK-FINDING:
      class: derived
      remedy: Fix the document the finding names; the engine's own code is at the start of the message.
    SDD-ENGINE-UNAVAILABLE:
      class: contract
      remedy: Install the engine (`pip install "architect-agent-framework[sdd]"`) or run through the plugin
        launcher.
- id: GATE-SDD-REGRESSION
  role: gate
  stage: manual
  kind: native
  entrypoint: architect_framework.gates.sdd:SddRegressionGate
  scope: workspace
  argv:
  - '{workspace}'
  usage: 'usage: GATE-SDD-REGRESSION {workspace}'
  side_effects: read-only
  phase: []
  findings:
  - SDD-REGRESSION-FAIL
  - SDD-REGRESSION-INCOMPLETE
  - SDD-REGRESSION-FINDING
  title: the SDD engine's readiness of a v2 workspace; incomplete until a person accepts the snapshot
  codes:
    SDD-REGRESSION-FAIL:
      class: contract
      remedy: Fix what the engine reports as a regression against the accepted baseline.
    SDD-REGRESSION-INCOMPLETE:
      class: contract
      remedy: Have a person review and accept the snapshot on the review console; an agent never accepts.
    SDD-REGRESSION-FINDING:
      class: derived
      remedy: Fix the document the finding names; the engine's own code is at the start of the message.
