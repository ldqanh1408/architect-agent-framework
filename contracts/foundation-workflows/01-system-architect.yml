workflow_contract:
  schema_version: sdd-skill/v2
  skill: 01-system-architect
  role: author
  capabilities:
  - author
  - configure
  workflow: references/workflow-v2.md
  state_authority: sdd_core.engine
  source_authority: confirmed requirements, accepted contracts, reconciled source manifest and approved ADRs
  owned_scope: workspace grant for architecture artifacts, coverage basis artifacts and own relationship obligations
  output: immutable candidate spanning source manifest, concern inventory, target plan, API, data, flows, NFR, mechanisms and derived views
  completion: deterministic result, source accounting, plan/depth coverage plus regression readiness; human acceptance is separate
  forbidden:
  - self approval
  - foreign artifact writes
  - direct engine state edits
  - silent downgrade of maximal intent to seed or minimal
  required_references:
  - references/architecture-method.md
  - references/document-style.md
  - references/output-contract.md
  conditional_references:
  - path: references/design/conditional-rules.md
    when: evaluate R11-R18 for every design; read matching sections
  - path: references/design/document-tree-primer.md
    when: framework document tree planning
  - path: references/design/target-document-tree-planning.md
    when: framework document tree planning
  - path: references/design/workspace-skeleton-maximal.md
    when: maximal coverage mode, multi-context decomposition, or catalog applicability check
  - path: references/design/child-skill-delegation.md
    when: routing delegated work
runtime_contract:
  schema_version: '2026.07'
  skill: 01-system-architect
  role: author and orchestrate the specification source of truth
  triggers:
  - a current task selects this skill under its accepted grant
  anti_triggers:
  - required upstream evidence is missing
  - the requested write belongs to another owner
  required_inputs:
  - sdd-workspace.yml
  - current source snapshot
  - accepted skill grant
  - artifact registry
  - source obligations
  optional_inputs:
  - stable_ids
  - skip_or_defer_reasons
  - document_coverage
  - source_manifest_artifact
  - concern_inventory_artifact
  - target_plan_artifact
  forbidden_inputs:
  - unaccepted proposals as execution authority
  owns: []
  read_only:
  - registered sources and current base candidate
  forbidden_writes:
  - foreign artifacts
  - direct engine state writes
  - human decision records
  required_outputs: []
  stable_ids_consumed:
  - upstream stable IDs when present
  stable_ids_produced:
  - artifact and clause IDs declared by the current registry
  completion_evidence:
  - reconciled source intake and independent obligation accounting
  - plan and mechanism depth witness coverage
  - isolated candidate and current deterministic checks
  - historical regression and independent review
  - separate signed human acceptance
  blocking_conditions:
  - missing evidence or authority
  - unresolved human questions
  - stale input or baseline
  resume_policy:
    strategy: resume-from-validated-artifact-manifest
    never_repeat_external_side_effect: true
  context_loading:
    always_load:
    - SKILL.md
    - skill-contract.yml
    - sdd-workspace.yml
    - references/design/document-tree-primer.md
    - references/design/target-document-tree-planning.md
    - references/design/workspace-skeleton-maximal.md
    - references/output-contract.md
    load_when:
      artifact-specific: only referenced template and source paths
    never_load_as_authority:
    - unaccepted policy or write grants
    - foreign artifact ownership
  validators:
  - architect-runtime sdd check <workspace> --change <change-id>
  - architect-runtime sdd regression <workspace> --change <change-id>
  authority: workspace accepted grants and current registry; empty static output lists
    are not permission to write
