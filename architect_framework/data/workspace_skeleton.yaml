module_slots:
- slot: README.md
  path: README.md
  page_class: repository_documentation
  kind: overview
  obligation: mandatory
  when: always
  description: Module entry README naming owner, boundaries, and navigation
- slot: source-map.yml
  path: source-map.yml
  page_class: null
  kind: ledger
  obligation: mandatory
  when: module_count >= 1
  description: Typed upstream/downstream provenance and dependency ledger
- slot: 00-overview
  path: 00-overview/{slug}-overview.md
  page_class: overview
  kind: overview
  obligation: mandatory
  when: always
  whitebox: true
  description: Bounded context overview, responsibilities, boundaries, and non-goals
- slot: 01-module-design
  path: 01-{module}/{module}-design.md
  page_class: mechanism
  kind: mechanism
  obligation: mandatory
  cardinality: per_module
  when: module_count >= 1
  description: Core business module design, runtime flow, decisions, and failure modes
- slot: 01-configuration
  path: 01-configuration/auto-configuration.md
  page_class: mechanism
  kind: mechanism
  obligation: conditional
  when: evidence.has('configuration_surface')
  description: Static configuration surface, conditional matrix, and defaults
- slot: 02-core-engine
  path: 02-core-engine/{mechanism}.md
  page_class: mechanism
  kind: mechanism
  obligation: conditional
  when: evidence.has('core_mechanism')
  aliases:
  - 02-domain-model
  description: Core mechanisms, patterns, algorithms, or tactical DDD aggregates/invariants
- slot: 03-extension-points
  path: 03-extension-points/spi-contracts.md
  page_class: api_contract
  kind: api_contract
  obligation: conditional
  when: evidence.has('extension_point')
  description: Public SPI, Fluid Builder DSL, and customizer callback contracts
- slot: 04-diagrams-specs
  path: 04-diagrams-specs/class-diagram.md
  page_class: diagram
  kind: diagram
  obligation: conditional
  when: evidence.has('visual_view_required')
  description: Context-scoped UML class, sequence, and state diagrams
- slot: 05-dependencies
  path: 05-dependencies/dependency-management.md
  page_class: standard_entry
  kind: standard_entry
  obligation: conditional
  when: evidence.has('dependency_policy')
  aliases:
  - 05-classpath-dependencies
  - 05-node-modules-dependencies
  - 05-crate-dependencies
  description: Stack-neutral BOM, dependency management, and transitive exclusions
- slot: 10-lifecycle
  path: 10-lifecycle/lifecycle-state-machine.md
  page_class: mechanism
  kind: mechanism
  obligation: conditional
  when: evidence.has('lifecycle_policy')
  description: State machines, startup/shutdown ordering, and hot-reload
- slot: 11-communication
  path: 11-communication/message-passing-protocol.md
  page_class: event_message
  kind: event_message
  obligation: conditional
  when: evidence.has('published_event') or evidence.has('inbound_port')
  description: Message passing, RPC, and event contracts
- slot: 20-security
  path: 20-security/{slug}-security.md
  page_class: mechanism
  kind: mechanism
  obligation: required_seam
  when: evidence.has('trust_boundary')
  description: Authentication, authorization, encryption, secrets, and sandboxing
- slot: 21-observability
  path: 21-observability/{slug}-observability.md
  page_class: mechanism
  kind: mechanism
  obligation: required_seam
  when: evidence.has('operational_target')
  description: Logs, metrics, traces, SLIs/SLOs, and MDC keys
- slot: 22-resilience
  path: 22-resilience/{slug}-resilience.md
  page_class: mechanism
  kind: mechanism
  obligation: required_seam
  when: evidence.has('failure_mode') or evidence.has('outbound_call')
  description: Retry, backoff, circuit breaker, bulkhead, and timeout budgets
- slot: 30-packaging
  path: 30-packaging/packaging-distribution.md
  page_class: artifact
  kind: artifact
  obligation: conditional
  when: evidence.has('release_surface')
  description: Artifact layout, entry points, and distribution manifest
- slot: 31-versioning
  path: 31-versioning/versioning-compatibility.md
  page_class: standard_entry
  kind: standard_entry
  obligation: conditional
  when: evidence.has('compatibility_window')
  description: SemVer policy, deprecation window, and migration guides
- slot: 90-appendices
  path: 90-appendices/glossary.md
  page_class: overview
  kind: overview
  obligation: conditional
  when: evidence.has('domain_fact')
  description: Module glossary, alternatives considered, and external references
- slot: tests/submodule.feature
  path: tests/submodule.feature
  page_class: null
  kind: verification
  obligation: mandatory
  when: workspace.level in ['maximal', 'portfolio']
  description: Executable BDD acceptance scenarios for the bounded context
- slot: verification/fitness-self-check.md
  path: verification/fitness-self-check.md
  page_class: verification
  kind: verification
  obligation: mandatory
  when: always
  description: Automated module fitness self-check rules and verification commands
- slot: 99-self-audit
  path: self-audit.md
  page_class: verification
  kind: audit_report
  obligation: mandatory
  when: workspace.level in ['maximal', 'portfolio']
  description: Module completeness, depth witness self-audit, and open seam ledger
