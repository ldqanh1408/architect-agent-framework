catalogue_version: '2026.08'
schema_version: '2026.08'
kind: workspace-skeleton
authority: sdd-workspace.yml#document_coverage
pack_free_core_archetypes:
- backend-service
- frontend
- ai-system
- data-platform
- identity-access
- integration-adapter
- infra-platform
- observability
core_archetype_clusters:
  backend-service: 03_application_architecture
  frontend: 01_frontend_architecture
  ai-system: 04_ai_architecture
  data-platform: 05_data_architecture
  identity-access: 07_security_architecture
  integration-adapter: 03_application_architecture
  infra-platform: 06_infrastructure_architecture
  observability: 08_quality_attribute_architecture
cluster_default_archetypes:
  01_business_architecture: business-capability
  02_domain_architecture: domain-capability
  03_application_architecture: backend-service
  04_ai_architecture: ai-system
  05_data_architecture: data-platform
  06_infrastructure_architecture: infra-platform
  07_security_architecture: infra-platform  # fallback only; primary Core Archetype for 07_security_architecture is identity-access (10/11 skills)
  08_quality_attribute_architecture: quality-assurance
  09_delivery_architecture: delivery-pipeline
  10_documentation_architecture: documentation-surface
module_folder_aliases:
- was: 11-communication
  now: 11-api
  since: '2026-08-08'
  reason: Split the conflated communication folder into 11-api / 12-events / 13-clients; the synchronous inbound surface kept
    the slot
waves:
  w1: w1-global-strategy
  w2: w2-shared-contracts
  w3: w3-frontend-contexts
  w4: w4-domain-contexts
  w5: w5-cross-cutting-delivery
  w6: w6-system-views-index
shared_contracts_subfolders:
- 00-core
- 01-data
- 02-apis
- 03-messages
- 04-external
- 05-state-machines
domain_clusters:
- 01_business_architecture
- 01_frontend_architecture
- 02_domain_architecture
- 03_application_architecture
- 04_ai_architecture
- 05_data_architecture
- 06_infrastructure_architecture
- 07_security_architecture
- 08_quality_attribute_architecture
- 09_delivery_architecture
- 10_documentation_architecture
