  - id: "21_delivery_planning"
    name: "21. Delivery Planning Tasks"
    core_activity: "Phasing an architecture into incremental delivery, and decomposing a phase into sized work"
    expected_technical_output: "Delivery Roadmap, Work Breakdown Structure"
    tasks:
      - id: "delivery-roadmap-planning"
        name: "Delivery Roadmap Phasing"
        description: "Divide the architecture into incremental delivery phases with quantitative exit criteria."
        procedural_steps:
          - "Phase 1 (MVP): core aggregate, main write path, database structure — the smallest slice that unblocks basic usage."
          - "Phase 2 (Beta/Integration): non-core API routes, messaging integrations, third-party payments, observability dashboards."
          - "Phase 3 (Scale & Ops): high availability, geo-replication, performance work, disaster recovery, automated backups."
          - "Give every phase a quantitative exit criterion — a number a run can check, not a sentiment."
        expected_outputs: ["Roadmap"]
      - id: "work-breakdown-decomposition"
        name: "Work Breakdown Structure Decomposition"
        description: "Decompose each delivery phase into sized, dependency-ordered units of work."
        procedural_steps:
          - "Size every unit so one developer finishes it in 1 to 5 days; anything larger is split before it is listed."
          - "State dependencies by id in both directions, so a blocked unit and its blocker each name the other."
          - "Estimate complexity in Fibonacci story points (1, 2, 3, 5, 8)."
          - "Give every unit an explicit definition of done: formatting, tests implemented, documentation updated."
          - "Write one TKT-{NNN}-{slug}.md per unit — points, blockers both ways, definition of done — and list every ticket id in the WBS."
        expected_outputs: ["WBS", "TKT-{NNN}-{slug}.md"]
