families:
  - id: "01_discovery"
    name: "01. Discovery Tasks"
    core_activity: "Requirement analysis, assumption, constraint, and initial risk discovery"
    expected_technical_output: "Constraint Matrix, Risk & Assumption Log"
    tasks:
      - id: "requirement-analysis"
        name: "Requirement Analysis"
        description: "Analyze and clarify functional and non-functional requirements."
        compatible_domain_clusters: ["01_business_architecture", "02_domain_architecture", "03_application_architecture"]
        procedural_steps:
          - "Step 1 - Gather: Collect raw requirements from user stories, epics, and meeting notes."
          - "Step 2 - Categorize: Split into Functional Requirements (FR) and Quality Attribute (NFR) buckets."
          - "Step 3 - Quantify NFRs: Assign measurable targets to each NFR (e.g. p99 latency < 200ms, availability 99.9%)."
          - "Step 4 - Validate: Cross-validate each requirement against a real stakeholder use case."
          - "Step 5 - Conflict Resolution: Identify conflicting requirements and force-rank by business priority."
          - "Step 6 - Traceability: Create a Requirement ID → Architecture Decision traceability matrix."
        expected_outputs: ["Requirement Specification Matrix", "NFR Traceability Map"]
      - id: "stakeholder-analysis"
        name: "Stakeholder Analysis"
        description: "Identify key stakeholders and their primary architectural concerns."
        compatible_domain_clusters: ["01_business_architecture", "10_documentation_architecture"]
        procedural_steps:
          - "Step 1 - Identify: List all internal (product, engineering, ops) and external (customers, regulators) stakeholders."
          - "Step 2 - Concerns Mapping: Map each stakeholder to their ISO 42010 concerns (Security, Performance, Cost, Compliance)."
          - "Step 3 - Influence Matrix: Plot stakeholders on an Influence vs Interest quadrant grid."
          - "Step 4 - Priority: Rank stakeholder concerns by frequency of conflict and business impact."
          - "Step 5 - Communication Plan: Define architectural review format and frequency per stakeholder group."
        expected_outputs: ["Stakeholder Concerns Map", "Stakeholder Influence Matrix"]
      - id: "business-goal-analysis"
        name: "Business Goal Analysis"
        description: "Align technical objectives with business growth metrics."
        procedural_steps:
          - "Extract core KPIs and ROI objectives."
          - "Translate business goals to target architecture metrics."
        expected_outputs: ["Business Goal Alignment Matrix"]
      - id: "constraint-analysis"
        name: "Constraint Analysis"
        description: "Identify technical, budget, regulatory, and organizational constraints."
        procedural_steps:
          - "Inventory hard constraints (legacy systems, compliance, cloud provider)."
          - "Evaluate constraint impact on architectural options."
        expected_outputs: ["Constraint Matrix"]
      - id: "assumption-discovery"
        name: "Assumption Discovery"
        description: "Surface underlying assumptions and validate validity."
        procedural_steps:
          - "Log initial system assumptions."
          - "Define validation criteria for each assumption."
        expected_outputs: ["Assumption Log"]
      - id: "dependency-discovery"
        name: "Dependency Discovery"
        description: "Map external and internal system dependencies."
        procedural_steps:
          - "Discover third-party APIs, vendor tools, and legacy systems."
          - "Document dependency SLAs and failure modes."
        expected_outputs: ["Dependency Map"]
      - id: "scope-definition"
        name: "Scope Definition"
        description: "Delineate system in-scope and out-of-scope boundaries."
        procedural_steps:
          - "Draw system context boundary."
          - "Document explicit out-of-scope exclusions."
        expected_outputs: ["System Scope Specification"]
      - id: "context-discovery"
        name: "Context Discovery"
        description: "Discover operating context and user personas."
        procedural_steps:
          - "Define environment contexts (Edge, Cloud, On-Prem)."
          - "Analyze user load profiles."
        expected_outputs: ["Operational Context Profile"]
      - id: "nfr-discovery"
        name: "NFR Discovery"
        description: "Formulate quantitative Non-Functional Requirements."
        compatible_domain_clusters: ["08_quality_attribute_architecture", "03_application_architecture"]
        procedural_steps:
          - "Step 1 - ISO 25010 Mapping: Map each quality concern to an ISO 25010 characteristic (Performance, Reliability, Security, Maintainability, Portability, etc.)."
          - "Step 2 - SLI Definition: Define measurable SLIs (latency p50/p99, error rate, throughput, availability uptime)."
          - "Step 3 - SLO Targets: Set SLO numeric targets with rationale (e.g. 99.9% availability = 8.7 hrs downtime/year max)."
          - "Step 4 - Load Profile: Define peak concurrent users, daily active users, request rate (rps), and expected growth trajectory."
          - "Step 5 - Error Budget: Compute per-SLO error budget and burn rate alerting thresholds."
          - "Step 6 - Environment Context: Distinguish NFR targets by environment (dev/staging vs prod)."
        expected_outputs: ["ISO 25010 NFR Specification", "SLO/SLI Definition Document"]
      - id: "risk-discovery"
        name: "Risk Discovery"
        description: "Identify architectural risks and potential failure modes."
        compatible_domain_clusters: ["07_security_architecture", "08_quality_attribute_architecture"]
        procedural_steps:
          - "Step 1 - Pre-mortem: Imagine the system has failed catastrophically. Work backwards to enumerate all plausible causes."
          - "Step 2 - STRIDE Scan: Run a STRIDE pass over each system component to discover security risks."
          - "Step 3 - Single Points of Failure: List every component where failure cascades to full system outage."
          - "Step 4 - Risk Scoring: Rate each risk by Probability (1-5) x Impact (1-5) = Risk Score."
          - "Step 5 - Mitigation: Define mitigation strategy for each High (score >= 12) risk."
          - "Step 6 - Residual Risk: Document accepted residual risks with owner and review date."
        expected_outputs: ["Architectural Risk Log", "Risk Mitigation Plan"]

  - id: "02_business_analysis"
    name: "02. Business Analysis Tasks"
    core_activity: "Business capability, process, and value stream modeling"
    expected_technical_output: "Business Capability Map, BPMN Diagram"
    tasks:
      - id: "capability-mapping"
        name: "Capability Mapping"
        description: "Map organizational business capabilities."
        procedural_steps:
          - "Decompose enterprise into level 1, 2, 3 capabilities."
          - "Map software modules to capabilities."
        expected_outputs: ["Business Capability Map"]
      - id: "business-process-modeling"
        name: "Business Process Modeling"
        description: "Model business workflows with BPMN standard."
        procedural_steps:
          - "Map process triggers, steps, decision gateways, and outcomes."
          - "Export BPMN 2.0 diagram format."
        expected_outputs: ["BPMN 2.0 Process Diagram"]
      - id: "value-stream-mapping"
        name: "Value Stream Mapping"
        description: "Analyze value delivery flow and friction points."
        procedural_steps:
          - "Identify value stream stages from customer request to fulfillment."
          - "Highlight lead time bottlenecks."
        expected_outputs: ["Value Stream Specification"]
      - id: "organization-mapping"
        name: "Organization Mapping"
        description: "Map team topologies and communication channels."
        procedural_steps:
          - "Identify stream-aligned, platform, and enabling teams."
          - "Apply Conway's Law alignment checks."
        expected_outputs: ["Team Topology Map"]
      - id: "stakeholder-mapping"
        name: "Stakeholder Mapping"
        description: "Create influence and interest matrix of business stakeholders."
        procedural_steps:
          - "Plot influence vs interest grid."
          - "Formulate engagement strategy."
        expected_outputs: ["Stakeholder Matrix"]

  - id: "03_domain_modeling"
    name: "03. Domain Modeling Tasks"
    core_activity: "Domain-Driven Design bounded context, aggregate, and event modeling"
    expected_technical_output: "Context Map, Domain Entity Model"
    tasks:
      - id: "entity-discovery"
        name: "Entity Discovery"
        description: "Discover core domain entities and identities."
        procedural_steps:
          - "Extract domain nouns with unique identity."
          - "Define attributes and entity life cycle."
        expected_outputs: ["Domain Entity Specification"]
      - id: "aggregate-design"
        name: "Aggregate Design"
        description: "Design DDD Aggregate boundaries and invariant rules."
        compatible_domain_clusters: ["02_domain_architecture"]
        procedural_steps:
          - "Step 1 - Identify Candidates: List all Entity candidates from the domain model that have unique identity."
          - "Step 2 - Select Aggregate Root: Choose the root Entity that guards invariants for the cluster."
          - "Step 3 - Define Invariants: Document all business rules that must remain consistent within one transaction."
          - "Step 4 - Set Boundaries: Rule: reference other Aggregates only by ID, never by direct object reference."
          - "Step 5 - Repository Interface: Define Repository interface for persistence operations on this Aggregate only."
          - "Step 6 - Command/Event Model: Map each state-changing Command to a Domain Event emitted upon success."
          - "Step 7 - Validate Size: Reject overly large aggregates. If an Aggregate spans more than 5 entities, re-evaluate boundaries."
        expected_outputs: ["DDD Aggregate Model", "Aggregate Boundary Spec", "Invariant Rules Documentation"]
      - id: "value-object-design"
        name: "Value Object Design"
        description: "Design immutable domain value objects."
        procedural_steps:
          - "Identify immutable concepts defined solely by attributes."
          - "Implement equality and validation logic."
        expected_outputs: ["Value Object Definitions"]
      - id: "repository-design"
        name: "Repository Design"
        description: "Design persistence abstraction for Aggregates."
        procedural_steps:
          - "Define domain repository interfaces."
          - "Decouple domain logic from DB storage."
        expected_outputs: ["Repository Interface Spec"]
      - id: "context-mapping"
        name: "Context Mapping"
        description: "Map relationships between Bounded Contexts."
        procedural_steps:
          - "Identify Upstream/Downstream context pairs."
          - "Choose mapping pattern (ACL, Shared Kernel, Customer-Supplier)."
        expected_outputs: ["Context Map Diagram"]
      - id: "domain-event-design"
        name: "Domain Event Design"
        description: "Design domain event structures and state notifications."
        procedural_steps:
          - "Identify past-tense domain events."
          - "Define event payload schema and metadata."
        expected_outputs: ["Domain Event Schema"]
      - id: "saga-design"
        name: "Saga Design"
        description: "Design distributed transaction Sagas with compensation steps."
        compatible_domain_clusters: ["02_domain_architecture", "03_application_architecture"]
        procedural_steps:
          - "Step 1 - Use Case Trigger: Identify which multi-service business transactions cannot use ACID."
          - "Step 2 - Orchestration vs Choreography: Decide pattern — Orchestration (central saga coordinator) vs Choreography (event-triggered reactions)."
          - "Step 3 - Happy Path Steps: List all forward transaction steps in sequential order with owning service."
          - "Step 4 - Compensating Transactions: For each step, define the compensating action that reverses its effect on failure."
          - "Step 5 - Idempotency: Ensure each saga step and compensation is idempotent for safe retry."
          - "Step 6 - Timeout & Failure Handling: Define timeout thresholds and fallback actions for each step."
          - "Step 7 - Observability: Add distributed trace spans and structured log events at each saga step boundary."
        expected_outputs: ["Saga Orchestration Spec", "Compensation Flow Diagram", "Saga Step Sequence Diagram"]
      - id: "workflow-design"
        name: "Workflow Design"
        description: "Design complex domain state machine transitions."
        procedural_steps:
          - "Define valid state machine states and transitions."
          - "Document state trigger conditions."
        expected_outputs: ["Domain State Machine Spec"]

  - id: "04_arch_style_selection"
    name: "04. Architecture Style Selection Tasks"
    core_activity: "Evaluating and choosing architectural styles"
    expected_technical_output: "Architecture Style Decision Record"
    tasks:
      - id: "layered-style"
        name: "Layered Architecture Evaluation"
        description: "Evaluate traditional layered N-tier architectural style."
        procedural_steps: ["Assess tier separation, coupling, and simplicity."]
        expected_outputs: ["Layered Style Assessment"]
      - id: "hexagonal-style"
        name: "Hexagonal Architecture Evaluation"
        description: "Evaluate Ports & Adapters / Hexagonal architectural style."
        procedural_steps: ["Assess domain isolation, port interfaces, and adapter testability."]
        expected_outputs: ["Hexagonal Style Assessment"]
      - id: "clean-style"
        name: "Clean Architecture Evaluation"
        description: "Evaluate Clean Architecture (Onion / Concentric circles)."
        procedural_steps: ["Validate Dependency Inversion Principle compliance across circles."]
        expected_outputs: ["Clean Architecture Assessment"]
      - id: "modular-monolith-style"
        name: "Modular Monolith Evaluation"
        description: "Evaluate modular monolith with enforced module boundaries."
        procedural_steps: ["Assess module decoupling and build time isolation."]
        expected_outputs: ["Modular Monolith Assessment"]
      - id: "microservice-style"
        name: "Microservice Evaluation"
        description: "Evaluate microservices style feasibility and operational overhead."
        compatible_domain_clusters: ["03_application_architecture", "06_infrastructure_architecture"]
        procedural_steps:
          - "Step 1 - Service Decomposition: Apply domain-driven decomposition to identify service boundaries."
          - "Step 2 - Coupling Analysis: Measure degree of coupling — reject styles where >30% of requests require cross-service calls."
          - "Step 3 - Operational Overhead: Estimate Kubernetes platform team FTE cost and tooling needs (CI/CD, service mesh, secrets)."
          - "Step 4 - Data Isolation: Verify each service owns its own data store. Flag shared databases as architectural violation."
          - "Step 5 - Communication Strategy: Select sync (REST/gRPC) vs async (Kafka/NATS) per service pair based on latency and consistency needs."
          - "Step 6 - Independent Deployability: Validate each service can be deployed independently without contract breakage."
          - "Step 7 - Tradeoff Summary: Quantify complexity cost vs scalability benefits."
        expected_outputs: ["Microservices Tradeoff Assessment", "Service Boundary Map", "Inter-service Communication Plan"]
      - id: "soa-style"
        name: "SOA Evaluation"
        description: "Evaluate Enterprise Service Bus (ESB) and SOA style."
        procedural_steps: ["Assess legacy service bus integration."]
        expected_outputs: ["SOA Evaluation Spec"]
      - id: "cqrs-style"
        name: "CQRS Style Evaluation"
        description: "Evaluate Command Query Responsibility Segregation."
        compatible_domain_clusters: ["02_domain_architecture", "05_data_architecture"]
        procedural_steps:
          - "Step 1 - Read/Write Ratio: Measure current read vs write throughput ratio. CQRS is beneficial when ratio > 10:1."
          - "Step 2 - Write Model: Design Command side with domain model, aggregate roots, and event sourcing (optional)."
          - "Step 3 - Read Model: Design denormalized Query side optimized for client view requirements."
          - "Step 4 - Sync Mechanism: Choose projection mechanism (Event Sourcing, CDC, or domain events) to keep read side updated."
          - "Step 5 - Consistency Boundary: Define acceptable eventual consistency lag between write and read models."
          - "Step 6 - Complexity Budget: Only apply CQRS to domains with genuinely divergent read/write needs."
        expected_outputs: ["CQRS Architectural Assessment", "Read/Write Model Separation Spec"]
      - id: "eda-style"
        name: "Event-Driven Architecture Evaluation"
        description: "Evaluate publish-subscribe and event streaming styles."
        procedural_steps: ["Analyze system decoupling, throughput, and event ordering."]
        expected_outputs: ["EDA Assessment Report"]
      - id: "serverless-style"
        name: "Serverless Architecture Evaluation"
        description: "Evaluate FaaS and managed cloud serverless style."
        procedural_steps: ["Analyze cold start latency and vendor lock-in."]
        expected_outputs: ["Serverless Feasibility Assessment"]
      - id: "plugin-style"
        name: "Plugin Architecture Evaluation"
        description: "Evaluate Microkernel / Plugin architectural style."
        procedural_steps: ["Analyze core framework vs dynamic plugin interfaces."]
        expected_outputs: ["Plugin Style Assessment"]
      - id: "actor-model-style"
        name: "Actor Model Evaluation"
        description: "Evaluate Akka / Ray / Erlang actor concurrent style."
        procedural_steps: ["Analyze message-passing concurrency and actor state."]
        expected_outputs: ["Actor Model Assessment"]
      - id: "pipeline-style"
        name: "Pipes & Filters Evaluation"
        description: "Evaluate pipeline architecture style."
        procedural_steps: ["Analyze sequential data transformation stages."]
        expected_outputs: ["Pipeline Style Assessment"]
      - id: "mesh-style"
        name: "Data Mesh Evaluation"
        description: "Evaluate decentralized domain-oriented data mesh style."
        procedural_steps: ["Analyze data as a product governance model."]
        expected_outputs: ["Data Mesh Assessment"]
      - id: "cell-based-style"
        name: "Cell-Based Architecture Evaluation"
        description: "Evaluate fault-isolated Cellular architecture style."
        procedural_steps: ["Analyze cell blast radius isolation and routing."]
        expected_outputs: ["Cell-Based Architecture Spec"]

  - id: "05_tech_selection"
    name: "05. Technology Selection Tasks"
    core_activity: "Evaluating and choosing technical solutions and frameworks"
    expected_technical_output: "Technology Evaluation Matrix"
    tasks:
      - id: "language-selection"
        name: "Programming Language Selection"
        description: "Select backend/frontend languages (Python, Go, Rust, TypeScript, Java)."
        procedural_steps: ["Evaluate memory management, ecosystem, performance, and developer availability."]
        expected_outputs: ["Language Evaluation Matrix"]
      - id: "framework-selection"
        name: "Framework Selection"
        description: "Select application frameworks (Spring Boot, FastAPI, Next.js, Gin)."
        procedural_steps: ["Assess framework maturity, community support, and performance."]
        expected_outputs: ["Framework Evaluation Matrix"]
      - id: "database-selection"
        name: "Database Selection"
        description: "Select database engine (PostgreSQL, MongoDB, Cassandra, Spanner)."
        procedural_steps: ["Analyze CAP theorem tradeoffs, query patterns, and ACID requirements."]
        expected_outputs: ["Database Selection Report"]
      - id: "cache-selection"
        name: "Cache Selection"
        description: "Select caching technology (Redis, Memcached, Dragonfly)."
        procedural_steps: ["Evaluate data structures, replication, and eviction policies."]
        expected_outputs: ["Cache Selection Matrix"]
      - id: "queue-selection"
        name: "Message Queue Selection"
        description: "Select messaging broker (Apache Kafka, RabbitMQ, AWS SQS, NATS)."
        procedural_steps: ["Evaluate ordering guarantees, throughput, and persistence."]
        expected_outputs: ["Queue Selection Report"]
      - id: "cloud-selection"
        name: "Cloud Provider Selection"
        description: "Evaluate cloud providers (AWS, GCP, Azure, Multi-cloud)."
        procedural_steps: ["Compare managed service maturity, global footprint, and pricing."]
        expected_outputs: ["Cloud Selection Matrix"]
      - id: "container-selection"
        name: "Container & Orchestration Selection"
        description: "Select container runtime and orchestrator (Kubernetes, ECS, Nomad)."
        procedural_steps: ["Evaluate cluster management complexity and scaling capabilities."]
        expected_outputs: ["Container Runtime Spec"]
      - id: "storage-selection"
        name: "Storage Solution Selection"
        description: "Select object and block storage solutions (S3, Ceph, EBS)."
        procedural_steps: ["Evaluate throughput, IOPS, and durability guarantees."]
        expected_outputs: ["Storage Selection Spec"]
      - id: "auth-selection"
        name: "Authentication Solution Selection"
        description: "Select identity providers (Keycloak, Auth0, Okta, Cognito)."
        procedural_steps: ["Assess OIDC compliance, custom protocol support, and SLA."]
        expected_outputs: ["IdP Selection Matrix"]
      - id: "monitoring-selection"
        name: "Monitoring & Observability Stack Selection"
        description: "Select MELT toolchain (Prometheus, Grafana, Datadog, Jaeger)."
        procedural_steps: ["Evaluate OpenTelemetry support, retention cost, and alerting."]
        expected_outputs: ["Observability Stack Matrix"]
      - id: "search-selection"
        name: "Search Engine Selection"
        description: "Select search engine (Elasticsearch, OpenSearch, Meilisearch)."
        procedural_steps: ["Evaluate indexing speed, relevance scoring, and cluster management."]
        expected_outputs: ["Search Engine Matrix"]
      - id: "sdk-selection"
        name: "SDK & Library Selection"
        description: "Select third-party SDKs and client libraries."
        procedural_steps: ["Audit licensing, security vulnerabilities, and maintenance."]
        expected_outputs: ["SDK Audit Matrix"]
      - id: "ai-model-selection"
        name: "AI Model Selection"
        description: "Select LLM / SLM models (Claude 3.5, GPT-4o, Llama 3, DeepSeek)."
        procedural_steps: ["Benchmark context length, reasoning accuracy, latency, and token cost."]
        expected_outputs: ["LLM Benchmark & Selection Matrix"]

  - id: "06_tradeoff_analysis"
    name: "06. Trade-off Analysis Tasks"
    core_activity: "ATAM methodology quality attribute tradeoff evaluation"
    expected_technical_output: "ATAM Sensitivity & Tradeoff Report"
    tasks:
      - id: "architecture-comparison"
        name: "Architecture Comparison"
        description: "Side-by-side comparison of candidate architecture options."
        procedural_steps: ["Formulate evaluation criteria.", "Score candidate architectures."]
        expected_outputs: ["Architecture Comparison Matrix"]
      - id: "technology-comparison"
        name: "Technology Comparison"
        description: "Benchmark and compare technology products."
        procedural_steps: ["Run empirical performance benchmarks.", "Evaluate total cost of ownership."]
        expected_outputs: ["Tech Benchmark Matrix"]
      - id: "decision-matrix"
        name: "Weighted Decision Matrix"
        description: "Create objective decision matrix with weighted parameters."
        procedural_steps: ["Assign parameter weights.", "Calculate weighted scores for options."]
        expected_outputs: ["Pugh Weighted Decision Matrix"]
      - id: "pros-cons-analysis"
        name: "Pros & Cons Analysis"
        description: "Detail qualitative pros and cons for architectural choices."
        procedural_steps: ["List advantages and risks for each choice."]
        expected_outputs: ["Pros & Cons Breakdown"]
      - id: "risk-analysis"
        name: "Architectural Risk Analysis"
        description: "Analyze technical and project risks."
        procedural_steps: ["Identify single points of failure.", "Define risk mitigation strategies."]
        expected_outputs: ["Risk Mitigation Report"]
      - id: "complexity-analysis"
        name: "Cognitive & Operational Complexity Analysis"
        description: "Evaluate maintenance complexity burden."
        procedural_steps: ["Calculate cognitive load and operational complexity index."]
        expected_outputs: ["Complexity Rating Spec"]
      - id: "cost-analysis"
        name: "Financial Cost Analysis"
        description: "Perform cost-benefit and TCO analysis."
        procedural_steps: ["Project infrastructure, licensing, and operational costs over 3 years."]
        expected_outputs: ["TCO Cost Model"]
      - id: "maintainability-analysis"
        name: "Maintainability Analysis"
        description: "Assess long-term code and system maintainability."
        procedural_steps: ["Evaluate modularity, coupling, and automated test coverage feasibility."]
        expected_outputs: ["ISO 25010 Maintainability Spec"]
      - id: "scalability-analysis"
        name: "Scalability Bottleneck Analysis"
        description: "Identify scalability limits under 10x traffic increase."
        procedural_steps: ["Simulate system bottlenecks at database, network, and application tiers."]
        expected_outputs: ["Scalability Limits Report"]

  - id: "07_system_modeling"
    name: "07. System Modeling Tasks"
    core_activity: "Visual modeling across C4, UML, BPMN, and ERD standards"
    expected_technical_output: "C4 Context/Container/Component Diagrams"
    tasks:
      - id: "context-diagram"
        name: "C4 Context Diagram Modeling"
        description: "Create C4 Level 1 System Context Diagram."
        compatible_domain_clusters: ["03_application_architecture", "10_documentation_architecture"]
        procedural_steps:
          - "Step 1 - Boundary: Draw the system boundary box as a single entity (the software system being built)."
          - "Step 2 - Users: Add user personas (primary and secondary) outside the boundary with relationship arrows."
          - "Step 3 - External Systems: Add all external systems (payment gateways, email SaaS, identity providers) the system integrates with."
          - "Step 4 - Relationships: Draw directional arrows with labels describing data/protocol exchanged."
          - "Step 5 - Notation: Use Mermaid C4Context or PlantUML C4 notation for tooling compatibility."
          - "Step 6 - Review: Validate diagram with stakeholders that all users and external systems are captured."
        expected_outputs: ["C4 Context Diagram (Mermaid/PlantUML)", "System Boundary Specification"]
      - id: "container-diagram"
        name: "C4 Container Diagram Modeling"
        description: "Create C4 Level 2 Container Diagram."
        procedural_steps: ["Decompose system into deployable containers (Web App, Mobile, API, DB)."]
        expected_outputs: ["C4 Container Diagram (Mermaid/PlantUML)"]
      - id: "component-diagram"
        name: "C4 Component Diagram Modeling"
        description: "Create C4 Level 3 Component Diagram."
        procedural_steps: ["Decompose container into structural application components."]
        expected_outputs: ["C4 Component Diagram (Mermaid/PlantUML)"]
      - id: "code-diagram"
        name: "C4 Code Diagram Modeling"
        description: "Create C4 Level 4 Class/Code Diagram for critical packages."
        procedural_steps: ["Model design patterns and class interfaces."]
        expected_outputs: ["C4 Code Diagram (Mermaid/PlantUML)"]
      - id: "deployment-diagram"
        name: "Deployment Diagram Modeling"
        description: "Model physical and cloud deployment topology."
        procedural_steps: ["Map containers to nodes, Kubernetes pods, and cloud regions."]
        expected_outputs: ["UML Deployment Diagram"]
      - id: "sequence-diagram"
        name: "Sequence Diagram Modeling"
        description: "Model inter-service interaction sequences."
        procedural_steps: ["Map synchronous and asynchronous message exchanges over timeline."]
        expected_outputs: ["UML Sequence Diagram"]
      - id: "erd-diagram"
        name: "ERD Modeling"
        description: "Model entity relationship database schemas."
        compatible_domain_clusters: ["05_data_architecture", "02_domain_architecture"]
        procedural_steps:
          - "Step 1 - Entity Discovery: List all domain entities that require persistence."
          - "Step 2 - Attribute Definition: Define column names, data types (VARCHAR, UUID, TIMESTAMP, BIGINT), and nullability."
          - "Step 3 - PK/FK Constraints: Assign primary keys, foreign keys, and unique constraints."
          - "Step 4 - Cardinality: Define relationship cardinalities (1:1, 1:N, M:N) for each entity pair."
          - "Step 5 - Junction Tables: Create junction tables for M:N relationships with composite PK."
          - "Step 6 - Indexing Hints: Annotate high-query-frequency columns for index candidates."
          - "Step 7 - Mermaid Output: Render using Mermaid erDiagram syntax for documentation-as-code."
        expected_outputs: ["ERD Diagram (Mermaid/PlantUML)", "Entity Attribute Spec", "Index Candidate List"]
      - id: "state-diagram"
        name: "State Diagram Modeling"
        description: "Model system lifecycle states."
        procedural_steps: ["Map state transitions, events, and guard conditions."]
        expected_outputs: ["UML State Diagram"]
      - id: "activity-diagram"
        name: "Activity Diagram Modeling"
        description: "Model procedural control flows."
        procedural_steps: ["Map parallel branches, decision points, and join bars."]
        expected_outputs: ["UML Activity Diagram"]
      - id: "class-diagram"
        name: "Class Diagram Modeling"
        description: "Model object-oriented class hierarchies."
        procedural_steps: ["Map class attributes, methods, inheritance, and interfaces."]
        expected_outputs: ["UML Class Diagram"]
      - id: "bpmn-diagram"
        name: "BPMN Modeling"
        description: "Model business workflows in BPMN standard."
        procedural_steps: ["Map swimlanes, tasks, and gateway logic."]
        expected_outputs: ["BPMN 2.0 Spec"]
      - id: "network-diagram"
        name: "Network Topology Modeling"
        description: "Model cloud VPC networks and security subnets."
        procedural_steps: ["Map VPCs, subnets, route tables, and gateways."]
        expected_outputs: ["Network Architecture Diagram"]

  - id: "08_api_design"
    name: "08. API Design Tasks"
    core_activity: "API contract definitions and interface design"
    expected_technical_output: "OpenAPI / AsyncAPI Specifications"
    tasks:
      - id: "rest-api-design"
