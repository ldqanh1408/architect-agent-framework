# ==============================================================================
# ARCHITECT AGENT FRAMEWORK (AAF) v2.0.0 — WORKSPACE SKELETON PROFILES
# ==============================================================================
# Canonical growth ladder specification (seed -> minimal -> standard -> maximal -> portfolio).
# Consumed by:
#   - architect_framework/contracts.py (`skeleton-profiles`)
#   - architect_framework/sdd_bridge/scaffolder.py (`scaffold_maximal_plan`, `materialize_workspace`)
#   - 01-system-architect/references/design/workspace-skeleton-maximal.md (Section 14.1)
# ==============================================================================

catalogue_version: '2026.08'
schema_version: '2.0.0'

ladder_order:
  - seed
  - minimal
  - standard
  - maximal
  - portfolio

optional_slot_policy:
  mandatory: populated unconditionally for the active profile
  conditional_with_evidence: populated and cites upstream source/concern evidence
  required_seam_without_evidence: receives a blocked seam notice naming the missing input
  not_applicable: omitted with rationale recorded in the enclosing 00-overview page
  applicable_without_substance_yet: omitted until evidence exists (never emit empty template shells)

profiles:
  seed:
    title: Seed (Single-Deployable / Early Discovery Baseline)
    description: >-
      Compact baseline for a single service or early prototype with up to 4 functional
      requirements. Omits 02-domains/ bounded-context decomposition completely so a
      single deployable never pretends to be a multi-context distributed system.
    max_bounded_contexts: 1
    max_frs: 4
    max_runtime_scenarios: 1
    requires_domains_band: false
    requires_full_archetype_expansion: false
    requires_individual_adrs: true
    requires_individual_scenarios: false
    requires_frontend_decomposition: false
    requires_segments_manifest: false
    include_standard_branches: false
    target_artifact_range: [6, 12]
    line_budget:
      min_lines: 80
      review_threshold_lines: 220
      max_lines: 350
    included_bands:
      - 00-plan
      - 00-system-views
      - 01-global-strategy
    mandatory_artifacts:
      - SRC-MANIFEST
      - CONCERN-INV
      - TARGET-PLAN
      - SYS-INDEX
      - VIEW-C1-CONTEXT
      - STRAT-CONTEXT
      - STRAT-REQUIREMENTS
      - STRAT-SOLUTION
      - STRAT-RISKS
    enter_when:
      - Single deployable binary or service with <= 4 FRs and no cross-context seams
    upgrade_triggers:
      - Second deployable unit or bounded context introduced (-> minimal/standard)
      - Functional requirements exceed 4 or require cross-domain contracts

  minimal:
    title: Minimal (Focused Single-Context Specification)
    description: >-
      Lightweight specification for a single bounded context (5-9 FRs) with core
      C1/C2 views, global strategy, one primary domain subtree, and planning shell.
    max_bounded_contexts: 1
    max_frs: 9
    max_runtime_scenarios: 2
    requires_domains_band: true
    requires_full_archetype_expansion: false
    requires_individual_adrs: true
    requires_individual_scenarios: true
    requires_frontend_decomposition: false
    requires_segments_manifest: false
    include_standard_branches: false
    target_artifact_range: [10, 18]
    line_budget:
      min_lines: 120
      review_threshold_lines: 220
      max_lines: 350
    included_bands:
      - 00-plan
      - 00-system-views
      - 01-global-strategy
      - 02-domains
      - 03-cross-cutting
      - 04-delivery
    mandatory_artifacts:
      - SRC-MANIFEST
      - CONCERN-INV
      - TARGET-PLAN
      - SYS-INDEX
      - VIEW-C1-CONTEXT
      - VIEW-C2-CONTAINERS
      - STRAT-CONTEXT
      - STRAT-REQUIREMENTS
      - STRAT-SOLUTION
      - STRAT-RISKS
      - DOM-OVERVIEW
      - XCUT-OVERVIEW
      - XCUT-FITNESS
      - DELIV-PLANNING
    enter_when:
      - Single bounded context with 5-9 FRs and localized persistence/API surface
    upgrade_triggers:
      - 2+ bounded contexts or shared cross-domain contracts (-> standard)
      - 10+ FRs or dedicated frontend + backend split

  standard:
    title: Standard (Multi-Context Production Service Architecture)
    description: >-
      Balanced multi-context specification (up to 3 bounded contexts, 10-19 FRs)
      covering ISO 42010 viewpoints, 7 core diagram views, global strategy, shared
      contracts, active archetype slots, cross-cutting mechanisms, and delivery gates.
    max_bounded_contexts: 3
    max_frs: 19
    max_runtime_scenarios: 3
    requires_domains_band: true
    requires_full_archetype_expansion: false
    requires_individual_adrs: true
    requires_individual_scenarios: true
    requires_frontend_decomposition: true
    requires_segments_manifest: false
    include_standard_branches: true
    target_artifact_range: [20, 60]
    line_budget:
      min_lines: 150
      review_threshold_lines: 220
      max_lines: 350
    included_bands:
      - 00-plan
      - 00-system-views
      - 01-global-strategy
      - 02-domains
      - 03-cross-cutting
      - 04-delivery
    mandatory_artifacts:
      - SRC-MANIFEST
      - CONCERN-INV
      - TARGET-PLAN
      - SYS-INDEX
      - VIEW-VIEWPOINTS
      - VIEW-C1-CONTEXT
      - VIEW-USE-CASES
      - VIEW-C2-CONTAINERS
      - VIEW-C3-COMPONENTS
      - VIEW-DEPLOYMENT
      - VIEW-INFORMATION-ERD
      - VIEW-RUNTIME-INDEX
      - STRAT-CONTEXT
      - STRAT-REQUIREMENTS
      - STRAT-SOLUTION
      - STRAT-STANDARDS
      - STRAT-RISKS
      - DOM-OVERVIEW
      - DOM-CONTEXT-MAP
      - SHARED-CORE-TYPES
      - SHARED-DATA-SCHEMAS
      - SHARED-API-CONTRACTS
      - SHARED-EVENT-MESSAGES
      - SHARED-EXTERNAL-CONTRACTS
      - SHARED-STATE-MACHINES
      - XCUT-OVERVIEW
      - XCUT-MECHANISMS
      - XCUT-SECURITY
      - XCUT-INFRA
      - XCUT-FITNESS
      - XCUT-EXCEPTIONS
      - DELIV-PLANNING
      - DELIV-QUALITY
      - DELIV-OPERATIONS
      - DELIV-AUDIT
    enter_when:
      - 2-3 bounded contexts, 10-19 FRs, and 1-3 runtime scenarios
    upgrade_triggers:
      - 4+ bounded contexts or >= 15 FRs with >= 20 domain entities (-> maximal)
      - Strict 9-dimension implementation depth and per-context self-audit required

  maximal:
    title: Maximal (Full ISO/IEC/IEEE 42010 Implementation-Grade Specification)
    description: >-
      Exhaustive, zero-stub specification accounting for 100% of atomic concerns (U)
      across all bounded contexts, all 8 core archetypes (or 21 specialized archetypes),
      7 core diagram views, 6 shared-contract branches, individual ADRs, individual
      runtime scenarios, and per-context self-audit.md.
    min_bounded_contexts: 2
    max_bounded_contexts: 12
    min_concerns_per_context: 5
    min_frs: 15
    min_entities: 20
    max_runtime_scenarios: 25
    requires_domains_band: true
    requires_full_archetype_expansion: true
    requires_individual_adrs: true
    requires_individual_scenarios: true
    requires_frontend_decomposition: true
    requires_segments_manifest: false
    include_standard_branches: true
    per_module_evidence:
      self_audit_md: true
      tests_submodule_feature: true
    target_artifact_range: [45, 250]
    line_budget:
      min_lines: 180
      review_threshold_lines: 220
      max_lines: 350
      hard_cap_lines: 400
    included_bands:
      - 00-plan
      - 00-system-views
      - 01-global-strategy
      - 02-domains
      - 03-cross-cutting
      - 04-delivery
    enter_when:
      - Default autonomous mode for `/architect-design` (`coverage_policy: maximal`)
      - Multi-context systems requiring implementation-grade boilerplate and 9 depth dimensions
    upgrade_triggers:
      - 10+ bounded contexts spanning multiple business segments or ecosystems (-> portfolio)

  portfolio:
    title: Portfolio (Multi-System Enterprise Landscape & Segment Architecture)
    description: >-
      Enterprise-scale specification for 10+ bounded contexts across multiple business
      segments. Extends maximal with C0 System Landscape (`c0-system-landscape.md`) and
      TOGAF Segment Manifest (`02-domains/00-overview/segments.md`).
    min_bounded_contexts: 10
    max_bounded_contexts: 50
    min_concerns_per_context: 5
    min_frs: 30
    min_entities: 40
    max_runtime_scenarios: 50
    requires_domains_band: true
    requires_full_archetype_expansion: true
    requires_individual_adrs: true
    requires_individual_scenarios: true
    requires_frontend_decomposition: true
    requires_segments_manifest: true
    requires_c0_landscape: true
    include_standard_branches: true
    per_module_evidence:
      self_audit_md: true
      tests_submodule_feature: true
    target_artifact_range: [100, 512]
    line_budget:
      min_lines: 180
      review_threshold_lines: 220
      max_lines: 350
      hard_cap_lines: 400
    included_bands:
      - 00-plan
      - 00-system-views
      - 01-global-strategy
      - 02-domains
      - 03-cross-cutting
      - 04-delivery
    portfolio_extra_artifacts:
      - id: VIEW-C0-LANDSCAPE
        path: architecture/00-system-views/01-context/c0-system-landscape.md
        kind: diagram
      - id: DOM-SEGMENTS
        path: architecture/02-domains/00-overview/segments.md
        kind: overview
    enter_when:
      - 10+ bounded contexts or multi-product enterprise portfolio requiring TOGAF segment partitioning
