rules:
  # ─────────────────── DDD & Application Consistency Rules ───────────────────
  - id: "CR-001-DDD-CONTAINER-MAPPING"
    source_viewpoint: "Bounded Context Viewpoint"
    target_viewpoint: "C4 Container Viewpoint"
    rule_type: "MustExist"
    expression: "Every Bounded Context defined in Domain Viewpoint MUST be mapped to at least 1 C4 Container."
    error_message: "Unmapped Bounded Context: Every domain bounded context must be assigned to an application container."

  - id: "CR-002-AGGREGATE-REPOSITORY-MAPPING"
    source_viewpoint: "Tactical DDD Viewpoint"
    target_viewpoint: "Database Viewpoint"
    rule_type: "AttributeMatch"
    expression: "Every Aggregate Root MUST have a corresponding primary persistence table or document schema."
    error_message: "Missing Persistence for Aggregate: Aggregate root has no corresponding database table."

  - id: "CR-003-API-SECURITY-AUTH"
    source_viewpoint: "API Viewpoint"
    target_viewpoint: "IAM Viewpoint"
    rule_type: "MustExist"
    expression: "Every public API endpoint MUST reference an explicit authentication/authorization scheme."
    error_message: "Unsecured API Endpoint: Public API endpoint has no associated security scheme."

  - id: "CR-004-CONTAINER-INFRA-RESOURCE"
    source_viewpoint: "C4 Container Viewpoint"
    target_viewpoint: "Infrastructure Viewpoint"
    rule_type: "MustExist"
    expression: "Every C4 Container MUST have defined CPU and Memory deployment resource limits."
    error_message: "Undefined Resource Limit: Container has no resource bounds configured in infrastructure specs."

  - id: "CR-005-DOMAIN-EVENT-MESSAGE-CHANNEL"
    source_viewpoint: "Event Viewpoint"
    target_viewpoint: "Message Broker Viewpoint"
    rule_type: "MustExist"
    expression: "Every Domain Event MUST have a corresponding message channel (topic/queue) in the message broker configuration."
    error_message: "Unmapped Domain Event: Domain event has no corresponding message channel defined."

  - id: "CR-006-INFRA-COST-ESTIMATE"
    source_viewpoint: "Infrastructure Viewpoint"
    target_viewpoint: "Cost Viewpoint"
    rule_type: "MustExist"
    expression: "Every infrastructure resource (VM, database, cache) MUST have a cost estimate in the FinOps model."
    error_message: "Missing Cost Estimate: Infrastructure resource has no associated cost model entry."

  - id: "CR-007-SLO-OBSERVABILITY-ALERT"
    source_viewpoint: "SLO Viewpoint"
    target_viewpoint: "Observability Viewpoint"
    rule_type: "MustExist"
    expression: "Every Service Level Objective (SLO) MUST have at least one corresponding Prometheus alerting rule."
    error_message: "Unmeasured SLO: SLO definition has no corresponding monitoring alert to enforce it."

  - id: "CR-008-SECURITY-THREAT-CONTROL"
    source_viewpoint: "Threat Model Viewpoint"
    target_viewpoint: "Security Control Viewpoint"
    rule_type: "MustExist"
    expression: "Every identified STRIDE threat MUST have a corresponding security control or mitigation strategy documented."
    error_message: "Unmitigated Threat: STRIDE threat has no documented mitigation control."

  - id: "CR-009-API-ASYNCAPI-CONTRACT"
    source_viewpoint: "API Viewpoint"
    target_viewpoint: "AsyncAPI Viewpoint"
    rule_type: "AttributeMatch"
    expression: "Every asynchronous event published by a service MUST have a corresponding AsyncAPI specification entry."
    error_message: "Undocumented Async API: Event-driven endpoint has no AsyncAPI specification."

  - id: "CR-010-DEPLOYMENT-ROLLBACK"
    source_viewpoint: "Deployment Viewpoint"
    target_viewpoint: "Rollback Viewpoint"
    rule_type: "MustExist"
    expression: "Every deployment pipeline MUST define an explicit rollback strategy."
    error_message: "No Rollback Strategy: Deployment pipeline has no defined rollback procedure."

  - id: "CR-011-CONTEXT-MAP-INTEGRATION-PATTERN"
    source_viewpoint: "Context Map Viewpoint"
    target_viewpoint: "Integration Pattern Viewpoint"
    rule_type: "MustExist"
    expression: "Every upstream/downstream context relationship MUST use an explicit integration pattern (ACL, Open Host, Published Language)."
    error_message: "Undeclared Integration Pattern: Context relationship has no explicit integration pattern assigned."

  - id: "CR-012-AI-AGENT-GUARDRAIL"
    source_viewpoint: "AI Agent Viewpoint"
    target_viewpoint: "Guardrail Viewpoint"
    rule_type: "MustExist"
    expression: "Every AI agent in the system MUST have input and output guardrails defined to prevent harmful or out-of-scope outputs."
    error_message: "Unguarded AI Agent: AI agent has no defined input/output guardrail configuration."

  - id: "CR-013-DATA-RETENTION-COMPLIANCE"
    source_viewpoint: "Data Schema Viewpoint"
    target_viewpoint: "Compliance Viewpoint"
    rule_type: "AttributeMatch"
    expression: "Every PII or sensitive data field MUST have a documented retention policy and encryption standard."
    error_message: "Unprotected PII Field: Sensitive data has no retention policy or encryption documented."

  - id: "CR-014-AGGREGATE-CDC-PIPELINE"
    source_viewpoint: "Tactical DDD Viewpoint"
    target_viewpoint: "Data Pipeline Viewpoint"
    rule_type: "MustExist"
    expression: "Every Aggregate Root with downstream read model consumers MUST have a CDC or event-driven sync mechanism."
    error_message: "Missing CDC Pipeline: Aggregate with read model consumers has no sync mechanism."

  - id: "CR-015-INFRA-NETWORK-POLICY"
    source_viewpoint: "Infrastructure Viewpoint"
    target_viewpoint: "Network Policy Viewpoint"
    rule_type: "MustExist"
    expression: "Every Kubernetes workload MUST have a NetworkPolicy defining allowed ingress and egress traffic."
    error_message: "Missing Network Policy: Kubernetes workload has no NetworkPolicy; all traffic is allowed by default."

  - id: "CR-016-DISASTER-RECOVERY-RTO-RPO"
    source_viewpoint: "SLO Viewpoint"
    target_viewpoint: "Disaster Recovery Viewpoint"
    rule_type: "AttributeMatch"
    expression: "Every system component with an availability SLO > 99.9% MUST have a Disaster Recovery plan with defined RTO and RPO."
    error_message: "Missing DR Plan: High-availability system has no documented RTO/RPO and DR procedure."
